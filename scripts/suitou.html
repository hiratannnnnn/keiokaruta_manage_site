<script>
let _suAllData = null;

const SU_STATUS_LABELS = {
  unknown: '参加費未設定',
  unpaid: '未払い',
  partial: '一部支払い',
  paid: '支払済み',
  overpaid: '過払い',
};

function showAccountingGuide() {
  document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
  document.getElementById('page-accounting-guide').classList.add('active');
}

function returnToSuitou() {
  document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
  document.getElementById('page-suitou').classList.add('active');
}

function initSuitou() {
  if (_suAllData) {
    suRenderTables(_suAllData);
    return;
  }
  suSetLoading(true);
  google.script.run
    .withSuccessHandler(json => {
      const result = JSON.parse(json);
      if (result.error) {
        suSetError(result.error);
        return;
      }
      _suAllData = result;
      suRenderTables(result);
    })
    .withFailureHandler(error => suSetError(error.message))
    .getSuitouSheets();
}

function reloadSuitou() {
  _suAllData = null;
  initSuitou();
}

function suSetLoading(on) {
  ['su-tx-status', 'su-entry-status'].forEach(id => {
    const element = document.getElementById(id);
    element.style.display = on ? 'block' : 'none';
    if (on) element.textContent = 'DBから読み込み中...';
  });
  document.getElementById('su-tx-table-wrap').style.display = 'none';
  document.getElementById('su-entry-table-wrap').style.display = 'none';
}

function suSetError(message) {
  ['su-tx-status', 'su-entry-status'].forEach(id => {
    const element = document.getElementById(id);
    element.style.display = 'block';
    element.className = 'status error';
    element.textContent = 'エラー: ' + message;
  });
}

function suRenderTables(data) {
  document.getElementById('su-fiscal-year').textContent =
    Number(data.fiscalYear) + '年度';
  suRenderTx(data.transactions || []);
  suRenderEntries(data.entries || []);
}

function suFormatTimestamp(value) {
  const text = String(value || '');
  return text.replace('T', ' ').replace(/([+-]\d{2}:\d{2}|Z)$/, '');
}

function suRenderTx(transactions) {
  const status = document.getElementById('su-tx-status');
  const wrap = document.getElementById('su-tx-table-wrap');
  const tbody = document.getElementById('su-tx-tbody');
  tbody.replaceChildren();
  if (!transactions.length) {
    status.style.display = 'block';
    status.className = 'status';
    status.textContent = '支払い・デポジット履歴がありません。';
    wrap.style.display = 'none';
    return;
  }
  status.style.display = 'none';
  transactions.forEach(transaction => {
    const row = document.createElement('tr');
    if (transaction.reversed_at) row.className = 'su-reversed-row';
    const name = document.createElement('td');
    name.textContent = transaction.name || '';
    const amount = document.createElement('td');
    amount.className = 'su-amount' + (Number(transaction.amount) < 0 ? ' su-amount-neg' : '');
    amount.textContent = Number(transaction.amount || 0).toLocaleString() + '円';
    const reason = document.createElement('td');
    reason.textContent = transaction.reason || '';
    if (transaction.note) reason.title = transaction.note;
    const date = document.createElement('td');
    date.className = 'su-date';
    date.textContent = suFormatTimestamp(transaction.date);
    const state = document.createElement('td');
    state.textContent = transaction.reversed_at ? '取消済み' : '有効';
    const actions = document.createElement('td');
    if (!transaction.reversed_at && transaction.reversible !== false) {
      const reverse = document.createElement('button');
      reverse.className = 'su-del-btn';
      reverse.textContent = '取消';
      reverse.addEventListener('click', () => suReverseTransaction(transaction, reverse));
      actions.appendChild(reverse);
    }
    row.append(name, amount, reason, date, state, actions);
    tbody.appendChild(row);
  });
  wrap.style.display = '';
}

function suRenderEntries(entries) {
  const status = document.getElementById('su-entry-status');
  const wrap = document.getElementById('su-entry-table-wrap');
  const tbody = document.getElementById('su-entry-tbody');
  tbody.replaceChildren();
  if (!entries.length) {
    status.style.display = 'block';
    status.className = 'status';
    status.textContent = '今年度の申込がありません。';
    wrap.style.display = 'none';
    return;
  }
  status.style.display = 'none';
  entries.forEach(entry => {
    const row = document.createElement('tr');
    const values = [
      entry.name,
      entry.tournament + entry.grade + '級',
      entry.fee === null ? '未設定' : Number(entry.fee).toLocaleString() + '円',
      Number(entry.paid || 0).toLocaleString() + '円',
      entry.balance === null ? '不明' : Number(entry.balance).toLocaleString() + '円',
      SU_STATUS_LABELS[entry.status] || entry.status,
      Number(entry.deposit_balance || 0).toLocaleString() + '円',
    ];
    values.forEach((value, index) => {
      const cell = document.createElement(index < 2 ? 'th' : 'td');
      cell.textContent = value || '';
      if (index === 4 && Number(entry.balance) < 0) cell.className = 'su-amount-neg';
      row.appendChild(cell);
    });
    tbody.appendChild(row);
  });
  wrap.style.display = '';
}

function suShowConfirm(message, onOk, title) {
  document.getElementById('su-confirm-title').textContent = title || '確認';
  document.getElementById('su-confirm-message').textContent = message;
  const ok = document.getElementById('su-confirm-ok');
  ok.onclick = () => {
    suCloseConfirm();
    onOk();
  };
  document.getElementById('su-confirm-modal').style.display = 'flex';
}

function suCloseConfirm(event) {
  if (event && event.target !== document.getElementById('su-confirm-modal')) return;
  document.getElementById('su-confirm-modal').style.display = 'none';
}

function suJstTimestamp() {
  const now = new Date();
  const offset = -now.getTimezoneOffset();
  const local = new Date(now.getTime() + offset * 60000);
  const sign = offset >= 0 ? '+' : '-';
  const hours = String(Math.floor(Math.abs(offset) / 60)).padStart(2, '0');
  const minutes = String(Math.abs(offset) % 60).padStart(2, '0');
  return local.toISOString().slice(0, 19) + sign + hours + ':' + minutes;
}

function suReverseTransaction(transaction, button) {
  suShowConfirm(
    'この履歴を取り消します。履歴自体は削除されません。よろしいですか？',
    () => {
      button.disabled = true;
      const reversedAt = suJstTimestamp();
      google.script.run
        .withSuccessHandler(json => {
          const result = JSON.parse(json);
          if (result.error) {
            button.disabled = false;
            suShowConfirm('エラー: ' + result.error, () => {}, '取消エラー');
            return;
          }
          reloadSuitou();
        })
        .withFailureHandler(error => {
          button.disabled = false;
          suShowConfirm('エラー: ' + error.message, () => {}, '取消エラー');
        })
        .reverseSuitouApiTransaction(transaction.type, transaction.id, reversedAt);
    },
    '履歴の取消'
  );
}

function suIdempotencyKey() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return 'suitou-' + crypto.randomUUID();
  }
  return 'suitou-' + Date.now() + '-' + Math.random().toString(36).slice(2)
    + '-' + Math.random().toString(36).slice(2);
}

function suShowAddModal() {
  if (!_suAllData || !_suAllData.entries.length) return;
  const select = document.getElementById('su-add-entry');
  select.replaceChildren();
  _suAllData.entries.forEach(entry => {
    const option = document.createElement('option');
    option.value = entry.entry_id;
    option.dataset.playerId = entry.player_id;
    option.textContent = entry.name + '｜' + entry.tournament + entry.grade + '級'
      + '｜残額 ' + (entry.balance === null ? '不明' : Number(entry.balance).toLocaleString() + '円')
      + '｜デポジット ' + Number(entry.deposit_balance || 0).toLocaleString() + '円';
    select.appendChild(option);
  });
  document.getElementById('su-add-operation').value = 'payment';
  document.getElementById('su-add-method').value = 'bank_transfer';
  document.getElementById('su-add-amount').value = '2500';
  document.getElementById('su-add-note').value = '';
  document.getElementById('su-add-idempotency').value = suIdempotencyKey();
  document.getElementById('su-add-submit').disabled = false;
  suOperationChanged();
  suAddError('');
  document.getElementById('su-add-modal').style.display = 'flex';
}

function suCloseAddModal(event) {
  if (event && event.target !== document.getElementById('su-add-modal')) return;
  document.getElementById('su-add-modal').style.display = 'none';
}

function suOperationChanged() {
  document.getElementById('su-add-method-wrap').style.display =
    document.getElementById('su-add-operation').value === 'payment' ? '' : 'none';
}

function suAddError(message) {
  const element = document.getElementById('su-add-error');
  element.textContent = message;
  element.style.display = message ? 'block' : 'none';
}

function suSubmitAdd() {
  const entrySelect = document.getElementById('su-add-entry');
  const selected = entrySelect.options[entrySelect.selectedIndex];
  const amount = Number(document.getElementById('su-add-amount').value);
  const note = document.getElementById('su-add-note').value.trim();
  if (!selected) {
    suAddError('対象の申込を選択してください。');
    return;
  }
  if (!Number.isInteger(amount) || amount <= 0) {
    suAddError('金額は1円以上の整数で入力してください。');
    return;
  }
  if (note.length > 1000) {
    suAddError('メモは1000文字以内で入力してください。');
    return;
  }
  const button = document.getElementById('su-add-submit');
  button.disabled = true;
  suAddError('');
  const payload = {
    operation: document.getElementById('su-add-operation').value,
    entry_id: selected.value,
    player_id: selected.dataset.playerId,
    amount_yen: amount,
    method: document.getElementById('su-add-method').value,
    note: note,
    idempotency_key: document.getElementById('su-add-idempotency').value,
  };
  google.script.run
    .withSuccessHandler(json => {
      const result = JSON.parse(json);
      if (result.error) {
        button.disabled = false;
        suAddError(result.error);
        return;
      }
      suCloseAddModal();
      reloadSuitou();
    })
    .withFailureHandler(error => {
      button.disabled = false;
      suAddError(error.message);
    })
    .addSuitouApiTransaction(JSON.stringify(payload));
}
</script>
