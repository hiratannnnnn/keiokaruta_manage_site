<script>
let sheetMigrationLoaded = false;
let sheetMigrationSignatures = {};
let sheetMigrationProgressTimer = null;
let sheetMigrationElapsedTimer = null;
let sheetMigrationStartedAt = 0;

function sheetMigrationEscAttr(value) {
  return escHtml(String(value)).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function initSheetMigration() {
  if (!sheetMigrationLoaded) sheetMigrationPreview();
}

function sheetMigrationPreview() {
  const status = document.getElementById('sheet-migration-status');
  const run = document.getElementById('sheet-migration-run');
  const preview = document.getElementById('sheet-migration-preview');
  const operationId = Date.now() + '-' + Math.random().toString(36).slice(2);
  run.disabled = true;
  preview.disabled = true;
  document.getElementById('sheet-migration-progress').style.display = '';
  document.getElementById('sheet-migration-progress-bar').style.width = '0%';
  status.textContent = '検査中...';
  status.className = 'op-status db-admin-searching';
  sheetMigrationStartProgress(operationId);
  google.script.run
    .withSuccessHandler(json => {
      sheetMigrationStopProgress();
      preview.disabled = false;
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      document.getElementById('sheet-migration-progress-bar').style.width = '100%';
      document.getElementById('sheet-migration-progress-text').textContent = '検査完了';
      sheetMigrationLoaded = true;
      sheetMigrationRenderPlans(data.plans || []);
      sheetMigrationRenderHistory(data.history || []);
      const summary = data.summary || {};
      status.textContent = Number(data.fiscal_year) + '年度：実行可能'
        + Number(summary.ready || 0)
        + '件、移行済み' + Number(summary.migrated || 0)
        + '件、実行不可' + Number(summary.blocked || 0) + '件';
      status.className = 'op-status ok';
      sheetMigrationUpdateRunButton();
    })
    .withFailureHandler(error => {
      sheetMigrationStopProgress();
      preview.disabled = false;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .previewTournamentSheetMigrations(operationId);
}

function sheetMigrationStartProgress(operationId) {
  sheetMigrationStopProgress();
  sheetMigrationStartedAt = Date.now();
  const updateElapsed = () => {
    const text = document.getElementById('sheet-migration-progress-text');
    if (!text || text.dataset.serverText) return;
    const seconds = Math.floor((Date.now() - sheetMigrationStartedAt) / 1000);
    text.textContent = '準備中…（経過' + seconds + '秒）';
  };
  updateElapsed();
  sheetMigrationElapsedTimer = setInterval(updateElapsed, 1000);

  const poll = () => {
    google.script.run
      .withSuccessHandler(json => {
        const data = JSON.parse(json);
        if (data.error) return;
        const total = Number(data.total || 0);
        const processed = Number(data.processed || 0);
        const percent = total
          ? Math.min(100, Math.round(processed / total * 100)) : 0;
        document.getElementById('sheet-migration-progress-bar').style.width =
          percent + '%';
        const seconds = Math.floor((Date.now() - sheetMigrationStartedAt) / 1000);
        const text = document.getElementById('sheet-migration-progress-text');
        text.dataset.serverText = 'true';
        const resultCounts = data.phase === 'executing' || data.phase === 'complete'
          ? '（成功' + Number(data.succeeded || 0)
            + '・スキップ' + Number(data.skipped || 0)
            + '・失敗' + Number(data.failed || 0) + '）'
          : '';
        text.textContent = total
          ? processed + ' / ' + total + '件 — ' + (data.current || '')
            + resultCounts + '（経過' + seconds + '秒）'
          : '準備中…（経過' + seconds + '秒）';
      })
      .withFailureHandler(() => {})
      .getTournamentSheetMigrationProgress(operationId);
  };
  poll();
  sheetMigrationProgressTimer = setInterval(poll, 1000);
}

function sheetMigrationStopProgress() {
  if (sheetMigrationProgressTimer) clearInterval(sheetMigrationProgressTimer);
  if (sheetMigrationElapsedTimer) clearInterval(sheetMigrationElapsedTimer);
  sheetMigrationProgressTimer = null;
  sheetMigrationElapsedTimer = null;
  const text = document.getElementById('sheet-migration-progress-text');
  if (text) delete text.dataset.serverText;
}

function sheetMigrationRenderPlans(plans) {
  sheetMigrationSignatures = {};
  plans.forEach(plan => {
    if (plan.status === 'ready' && plan.snapshot_signature) {
      sheetMigrationSignatures[plan.sheet_name] = plan.snapshot_signature;
    }
  });
  const panel = document.getElementById('sheet-migration-plans');
  panel.style.display = '';
  const rows = plans.map(plan => {
    const ready = plan.status === 'ready';
    const details = ready
      ? ('情報' + Number(plan.non_empty_cell_count || 0) + 'セルを'
        + (plan.move_target || '大会管理データv2') + 'へ正規化・再読取検証後、'
        + plan.delete_start_column + '列目から' + plan.delete_column_count
        + '列の旧管理領域を撤去：' + (plan.delete_column_headers || []).join('、'))
      : (plan.reason || plan.status);
    const warnings = (plan.warnings || []).join(' / ');
    return '<tr>'
      + '<td><input class="sheet-migration-checkbox" type="checkbox" '
      + 'value="' + sheetMigrationEscAttr(plan.sheet_name) + '" '
      + (ready ? '' : 'disabled ') + 'onchange="sheetMigrationUpdateRunButton()"></td>'
      + '<td>' + escHtml(plan.sheet_name) + '</td>'
      + '<td>' + escHtml(plan.status) + '</td>'
      + '<td>' + escHtml(details) + '</td>'
      + '<td>' + escHtml(warnings) + '</td>'
      + '</tr>';
  }).join('');
  panel.innerHTML = '<div class="panel-header">シート別dry-run結果</div>'
    + '<div class="panel-body"><div class="db-admin-table-wrap"><table class="db-admin-table">'
    + '<thead><tr><th>選択</th><th>シート</th><th>状態</th>'
    + '<th>変更予定</th><th>警告</th></tr></thead><tbody>'
    + rows + '</tbody></table></div></div>';
}

function sheetMigrationRenderHistory(history) {
  const panel = document.getElementById('sheet-migration-history');
  panel.style.display = '';
  const rows = history.map(item => '<tr>'
    + '<td>' + escHtml(item.executed_at || '') + '</td>'
    + '<td>' + escHtml(item.sheet_name) + '</td>'
    + '<td>' + escHtml(item.status) + '</td>'
    + '<td>' + Number(item.delete_column_count || 0) + '列</td>'
    + '</tr>').join('');
  panel.innerHTML = '<div class="panel-header">実行履歴</div>'
    + '<div class="panel-body"><div class="db-admin-table-wrap"><table class="db-admin-table">'
    + '<thead><tr><th>実行日時</th><th>シート</th><th>状態</th>'
    + '<th>削除列</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4">実行履歴はありません。</td></tr>')
    + '</tbody></table></div></div>';
}

function sheetMigrationSelectedNames() {
  return Array.from(document.querySelectorAll('.sheet-migration-checkbox:checked'))
    .map(input => input.value);
}

function sheetMigrationSelectedRequests() {
  return sheetMigrationSelectedNames().map(name => ({
    sheet_name: name,
    snapshot_signature: sheetMigrationSignatures[name] || '',
  }));
}

function sheetMigrationUpdateRunButton() {
  document.getElementById('sheet-migration-run').disabled =
    sheetMigrationSelectedNames().length === 0;
}

function sheetMigrationRun() {
  const names = sheetMigrationSelectedNames();
  if (!names.length) return;
  if (!window.confirm(
    names.length + '件のシートを移行します。'
    + '選択したシートだけが対象です。実行しますか？'
  )) return;
  const run = document.getElementById('sheet-migration-run');
  const preview = document.getElementById('sheet-migration-preview');
  const status = document.getElementById('sheet-migration-status');
  const operationId = Date.now() + '-' + Math.random().toString(36).slice(2);
  run.disabled = true;
  preview.disabled = true;
  document.getElementById('sheet-migration-progress').style.display = '';
  document.getElementById('sheet-migration-progress-bar').style.width = '0%';
  status.textContent = '選択した' + names.length + '件を移行中...';
  status.className = 'op-status db-admin-searching';
  sheetMigrationStartProgress(operationId);
  google.script.run
    .withSuccessHandler(json => {
      sheetMigrationStopProgress();
      preview.disabled = false;
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        document.getElementById('sheet-migration-progress-text').textContent =
          '移行を開始できませんでした。';
        sheetMigrationUpdateRunButton();
        return;
      }
      const results = data.results || [];
      const succeeded = results.filter(item => item.status === 'success').length;
      const skipped = results.filter(item => item.status === 'skipped').length;
      const failed = results.filter(item => item.status === 'failed').length;
      const moved = results.reduce(
        (total, item) => total + Number(item.moved_cell_count || 0), 0
      );
      document.getElementById('sheet-migration-progress-bar').style.width = '100%';
      document.getElementById('sheet-migration-progress-text').textContent =
        '移行完了：成功' + succeeded + '件・失敗' + failed + '件';
      status.textContent = '移行完了：成功' + succeeded + '件、失敗' + failed + '件';
      status.className = failed ? 'op-status error' : 'op-status ok';
      alert(
        '移行結果：成功' + succeeded + '件、スキップ' + skipped
        + '件、失敗' + failed + '件、v2へ記録・監査保存' + moved + 'セル'
      );
      sheetMigrationPreview();
    })
    .withFailureHandler(error => {
      sheetMigrationStopProgress();
      preview.disabled = false;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
      document.getElementById('sheet-migration-progress-text').textContent =
        '移行処理に失敗しました。';
      sheetMigrationUpdateRunButton();
    })
    .executeTournamentSheetMigrations(JSON.stringify(
      sheetMigrationSelectedRequests()
    ), operationId);
}

</script>
