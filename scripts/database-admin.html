<script>
const DB_ADMIN_RESOURCES = {
  'tournaments': {
    path: '/tournaments', label: '大会', editable: true, deletable: true,
    fields: ['name', 'registration_completed', 'payment_completed'],
  },
  'schedules': {
    path: '/schedules', label: '日程', editable: true,
    fields: ['held_on', 'grade', 'application_deadline', 'payment_deadline', 'payment_timing',
      'internal_payment_deadline', 'payment_instructions', 'lottery_result_date',
      'venue', 'reception_ends_at', 'is_sanctioned'],
  },
  'players': {
    path: '/players', label: '選手', editable: true,
    fields: ['family_name', 'given_name', 'ruby', 'line_user_id', 'club'],
  },
  'entries': { path: '/entries', label: '申込', editable: true, fields: ['schedule_id'] },
  'announcements': {
    path: '/announcements', label: '案内', editable: true,
    fields: ['subject', 'form_url', 'gmail_message_id'],
  },
  'recipient-groups': {
    path: '/recipient-groups', label: '宛先グループ', editable: true, fields: ['name'],
  },
  'email-jobs': {
    path: '/email-jobs', label: 'メールジョブ', editable: true,
    fields: ['scheduled_at', 'mail_type', 'announcement_id'],
  },
  'email-deliveries': {
    path: '/email-deliveries', label: '配信履歴', editable: false, fields: [],
  },
};

const DB_ADMIN_PAGE_SIZE = 25;
const dbAdminPanes = {
  left:  { allRows: [], filteredRows: [], rows: [], total: 0, offset: 0, timer: null, requestId: 0 },
  right: { allRows: [], filteredRows: [], rows: [], total: 0, offset: 0, timer: null, requestId: 0 },
};
let dbAdminSelected = null;
let dbAdminFiscalPreviewValid = false;
let dbAdminFiscalProgressTimer = null;
let dbAdminFiscalElapsedTimer = null;
let dbAdminFiscalStartedAt = 0;
let dbAdminEmailPreviewValid = false;

function dbAdminPreviewEmailMigration() {
  const status = document.getElementById('db-admin-email-status');
  const button = document.getElementById('db-admin-email-run-btn');
  status.textContent = 'DB内の選手を検査中...';
  status.className = 'op-status db-admin-searching';
  button.disabled = true;
  dbAdminEmailPreviewValid = false;
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      dbAdminEmailPreviewValid = true;
      button.disabled = data.migration_count === 0;
      status.textContent = '全' + data.total + '人中、移行対象' + data.migration_count
        + '人、移行済み' + data.already_migrated + '人';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .previewPlayerEmailMigration();
}

function dbAdminRunEmailMigration() {
  if (!dbAdminEmailPreviewValid) return;
  if (!confirm('検査済みの選手メールを疑似メールへ移行します。よろしいですか？')) return;
  const status = document.getElementById('db-admin-email-status');
  const button = document.getElementById('db-admin-email-run-btn');
  button.disabled = true;
  dbAdminEmailPreviewValid = false;
  status.textContent = '疑似メールへ移行中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      status.textContent = data.updated_count + '人を移行しました。';
      status.className = 'op-status ok';
      dbAdminLoadPane('left');
      dbAdminLoadPane('right');
    })
    .withFailureHandler(error => {
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .migratePlayerEmails();
}

function initDatabaseAdmin() {
  dbAdminMethodChanged();
  if (!document.getElementById('db-admin-table-left').dataset.loaded) {
    dbAdminLoadPane('left');
    dbAdminLoadPane('right');
  }
}

function dbAdminPreviewFiscalSync() {
  const status = document.getElementById('db-admin-sync-status');
  const output = document.getElementById('db-admin-sync-preview');
  const runButton = document.getElementById('db-admin-sync-run-btn');
  const errors = document.getElementById('db-admin-sync-errors');
  const operationId = Date.now() + '-' + Math.random().toString(36).slice(2);
  dbAdminFiscalPreviewValid = false;
  runButton.disabled = true;
  errors.style.display = 'none';
  errors.innerHTML = '';
  document.getElementById('db-admin-sync-progress').style.display = '';
  document.getElementById('db-admin-sync-progress-bar').style.width = '0%';
  status.textContent = 'シートを検査中...（通常30秒〜3分程度）';
  status.className = 'op-status db-admin-searching';
  dbAdminStartFiscalProgress(operationId);
  google.script.run
    .withSuccessHandler(json => {
      dbAdminStopFiscalProgress();
      const data = JSON.parse(json);
      output.style.display = '';
      output.textContent = JSON.stringify(data, null, 2);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      if ((data.errors || []).length) {
        status.textContent = '同期できません：' + data.errors.length + '件の検証エラー';
        status.className = 'op-status error';
        errors.innerHTML = data.errors.map(error => '<li>' + escHtml(error) + '</li>').join('');
        errors.style.display = '';
        return;
      }
      if ((data.warnings || []).length) {
        errors.innerHTML = data.warnings.map(warning =>
          '<li>警告: ' + escHtml(warning) + '</li>'
        ).join('');
        errors.style.display = '';
      }
      dbAdminFiscalPreviewValid = true;
      runButton.disabled = false;
      status.textContent = data.fiscal_year + '年度：大会'
        + data.summary.tournament_count + '件、日程' + data.summary.schedule_count
        + '件、申込' + data.summary.entry_count + '件、メールジョブ'
        + Number((data.mail_sync && data.mail_sync.summary
          && data.mail_sync.summary.candidate_count) || 0) + '件'
        + ((data.warnings || []).length ? '（警告' + data.warnings.length + '件）' : '');
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      dbAdminStopFiscalProgress();
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .previewFiscalYearDatabaseSync(operationId);
}

function dbAdminStartFiscalProgress(operationId) {
  dbAdminStopFiscalProgress();
  dbAdminFiscalStartedAt = Date.now();
  const updateElapsed = () => {
    const seconds = Math.floor((Date.now() - dbAdminFiscalStartedAt) / 1000);
    const text = document.getElementById('db-admin-sync-progress-text');
    if (text && !text.dataset.serverText) text.textContent = '準備中… 経過' + seconds + '秒';
  };
  updateElapsed();
  dbAdminFiscalElapsedTimer = setInterval(updateElapsed, 1000);

  const poll = () => {
    google.script.run
      .withSuccessHandler(json => {
        const data = JSON.parse(json);
        if (data.error) return;
        const total = Number(data.total || 0);
        const processed = Number(data.processed || 0);
        const percent = total ? Math.min(100, Math.round(processed / total * 100)) : 0;
        document.getElementById('db-admin-sync-progress-bar').style.width = percent + '%';
        const seconds = Math.floor((Date.now() - dbAdminFiscalStartedAt) / 1000);
        const text = document.getElementById('db-admin-sync-progress-text');
        text.dataset.serverText = 'true';
        text.textContent = total
          ? processed + ' / ' + total + '行を検査済み — ' + (data.current || '')
            + '（経過' + seconds + '秒）'
          : '準備中…（経過' + seconds + '秒）';
      })
      .getFiscalYearSyncProgress(operationId);
  };
  poll();
  dbAdminFiscalProgressTimer = setInterval(poll, 1000);
}

function dbAdminStopFiscalProgress() {
  if (dbAdminFiscalProgressTimer) clearInterval(dbAdminFiscalProgressTimer);
  if (dbAdminFiscalElapsedTimer) clearInterval(dbAdminFiscalElapsedTimer);
  dbAdminFiscalProgressTimer = null;
  dbAdminFiscalElapsedTimer = null;
  const text = document.getElementById('db-admin-sync-progress-text');
  if (text) delete text.dataset.serverText;
}

function dbAdminRunFiscalSync() {
  if (!dbAdminFiscalPreviewValid) return;
  if (!window.confirm(
    '大会・日程・申込を履歴を残したまま差分同期し、'
    + '未送信メールジョブとGmail紐付けも同期します。実行しますか？'
  )) return;
  const status = document.getElementById('db-admin-sync-status');
  const button = document.getElementById('db-admin-sync-run-btn');
  button.disabled = true;
  status.textContent = '完全同期中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      if (data.error) {
        button.disabled = false;
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      dbAdminFiscalPreviewValid = false;
      status.textContent = data.warning
        ? '履歴保全型の完全同期を実行しました（警告: ' + data.warning + '）'
        : '履歴保全型の完全同期を実行しました';
      status.className = 'op-status ' + (data.warning ? 'error' : 'ok');
      document.getElementById('db-admin-sync-preview').textContent =
        JSON.stringify(data, null, 2);
      dbAdminLoadPane('left');
      dbAdminLoadPane('right');
    })
    .withFailureHandler(error => {
      button.disabled = false;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .syncFiscalYearDatabase();
}

function dbAdminCall(request, onSuccess, onFailure) {
  google.script.run
    .withSuccessHandler(json => {
      const response = JSON.parse(json);
      response.error ? onFailure(new Error(response.error)) : onSuccess(response.data);
    })
    .withFailureHandler(error => onFailure(error))
    .databaseAdminRequest(JSON.stringify(Object.assign({
      query: {}, body: null,
    }, request)));
}

function dbAdminChangeResource(side) {
  const pane = dbAdminPanes[side];
  pane.offset = 0;
  document.getElementById('db-admin-filter-' + side).value = '';
  dbAdminLoadPane(side);
}

function dbAdminScheduleSearch(side) {
  const pane = dbAdminPanes[side];
  clearTimeout(pane.timer);
  pane.offset = 0;
  const status = document.getElementById('db-admin-status-' + side);
  status.textContent = '検索中...';
  status.className = 'op-status db-admin-searching';
  pane.timer = setTimeout(() => dbAdminApplyFilter(side), 200);
}

function dbAdminLoadPane(side) {
  const pane = dbAdminPanes[side];
  const key = document.getElementById('db-admin-resource-' + side).value;
  const resource = DB_ADMIN_RESOURCES[key];
  const status = document.getElementById('db-admin-status-' + side);
  const reload = document.getElementById('db-admin-reload-' + side);
  const requestId = ++pane.requestId;
  clearTimeout(pane.timer);
  reload.disabled = true;
  status.textContent = '読み込み中...';
  status.className = 'op-status db-admin-searching';

  dbAdminCall({
    method: 'GET',
    path: resource.path,
  }, data => {
    if (requestId !== pane.requestId) return;
    reload.disabled = false;
    pane.allRows = Array.isArray(data) ? data : (data ? [data] : []);
    document.getElementById('db-admin-table-' + side).dataset.loaded = 'true';
    dbAdminApplyFilter(side);
  }, error => {
    if (requestId !== pane.requestId) return;
    reload.disabled = false;
    pane.allRows = [];
    pane.filteredRows = [];
    pane.rows = [];
    pane.total = 0;
    status.textContent = 'エラー: ' + error.message;
    status.className = 'op-status error';
    dbAdminRenderPane(side);
  });
}

function dbAdminApplyFilter(side) {
  const pane = dbAdminPanes[side];
  const search = document.getElementById('db-admin-filter-' + side).value.trim().toLowerCase();
  const status = document.getElementById('db-admin-status-' + side);
  pane.filteredRows = pane.allRows.filter(row =>
    !search || Object.values(row).some(value =>
      dbAdminCellText(value).toLowerCase().includes(search)
    )
  );
  pane.total = pane.filteredRows.length;
  if (pane.offset >= pane.total) pane.offset = 0;
  pane.rows = pane.filteredRows.slice(pane.offset, pane.offset + DB_ADMIN_PAGE_SIZE);
  status.textContent = search ? '検索完了：' + pane.total + '件' : pane.total + '件';
  status.className = 'op-status ok';
  dbAdminRenderPane(side);
}

function dbAdminCellText(value) {
  if (value === null || value === undefined) return '';
  return typeof value === 'object' ? JSON.stringify(value) : String(value);
}

function dbAdminRenderPane(side) {
  const pane = dbAdminPanes[side];
  const table = document.getElementById('db-admin-table-' + side);
  const columns = [];
  pane.rows.forEach(row => Object.keys(row).forEach(key => {
    if (!columns.includes(key)) columns.push(key);
  }));
  const resource = DB_ADMIN_RESOURCES[document.getElementById('db-admin-resource-' + side).value];

  if (!pane.rows.length) {
    table.style.display = 'none';
    document.getElementById('db-admin-thead-' + side).innerHTML = '';
    document.getElementById('db-admin-tbody-' + side).innerHTML = '';
  } else {
    document.getElementById('db-admin-thead-' + side).innerHTML =
      '<tr>' + columns.map(column => '<th>' + escHtml(column) + '</th>').join('') + '</tr>';
    document.getElementById('db-admin-tbody-' + side).innerHTML = pane.rows.map((row, index) =>
      '<tr' + (resource.editable
        ? ` class="db-admin-editable-row" onclick="dbAdminOpenEditor('${side}',${index})"`
        : '') + '>' +
      columns.map(column => '<td>' + escHtml(dbAdminCellText(row[column])) + '</td>').join('') +
      '</tr>'
    ).join('');
    table.style.display = '';
  }

  const start = pane.total ? pane.offset + 1 : 0;
  const end = Math.min(pane.offset + pane.rows.length, pane.total);
  const page = Math.floor(pane.offset / DB_ADMIN_PAGE_SIZE) + 1;
  const pages = Math.max(1, Math.ceil(pane.total / DB_ADMIN_PAGE_SIZE));
  document.getElementById('db-admin-page-' + side).textContent =
    start + '–' + end + ' / ' + pane.total + '件（' + page + ' / ' + pages + 'ページ）';
  document.getElementById('db-admin-prev-' + side).disabled = pane.offset <= 0;
  document.getElementById('db-admin-next-' + side).disabled =
    pane.offset + DB_ADMIN_PAGE_SIZE >= pane.total;
}

function dbAdminMovePage(side, direction) {
  const pane = dbAdminPanes[side];
  const next = pane.offset + direction * DB_ADMIN_PAGE_SIZE;
  if (next < 0 || next >= pane.total) return;
  pane.offset = next;
  dbAdminApplyFilter(side);
}

function dbAdminOpenEditor(side, index) {
  const key = document.getElementById('db-admin-resource-' + side).value;
  const resource = DB_ADMIN_RESOURCES[key];
  const row = dbAdminPanes[side].rows[index];
  if (!resource.editable || !row || row.id === undefined) return;
  dbAdminSelected = { side, key, id: row.id };
  const editableData = {};
  resource.fields.forEach(field => {
    if (Object.prototype.hasOwnProperty.call(row, field)) editableData[field] = row[field];
  });
  document.getElementById('db-admin-edit-title').textContent =
    resource.label + ' ID ' + row.id + ' を編集（' + (side === 'left' ? '左' : '右') + '画面）';
  document.getElementById('db-admin-edit-json').value = JSON.stringify(editableData, null, 2);
  document.getElementById('db-admin-delete-row').style.display = resource.deletable ? '' : 'none';
  document.getElementById('db-admin-edit-status').textContent = '';
  document.getElementById('db-admin-edit-panel').style.display = '';
  document.getElementById('db-admin-edit-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function dbAdminCloseEditor() {
  dbAdminSelected = null;
  const panel = document.getElementById('db-admin-edit-panel');
  if (panel) panel.style.display = 'none';
}

function dbAdminSaveRow() {
  if (!dbAdminSelected) return;
  const selected = dbAdminSelected;
  const resource = DB_ADMIN_RESOURCES[selected.key];
  const status = document.getElementById('db-admin-edit-status');
  let body;
  try {
    body = JSON.parse(document.getElementById('db-admin-edit-json').value);
  } catch (e) {
    status.textContent = 'JSONが不正です。';
    status.className = 'op-status error';
    return;
  }
  if (!window.confirm(resource.label + ' ID ' + selected.id + ' の変更を保存しますか？')) return;
  status.textContent = '保存中...';
  status.className = 'op-status';
  dbAdminCall({ method: 'PATCH', path: resource.path + '/' + selected.id, body }, () => {
    dbAdminCloseEditor();
    dbAdminLoadPane(selected.side);
  }, error => {
    status.textContent = 'エラー: ' + error.message;
    status.className = 'op-status error';
  });
}

function dbAdminDeleteRow() {
  if (!dbAdminSelected || dbAdminSelected.key !== 'tournaments') return;
  const selected = dbAdminSelected;
  if (!window.confirm('大会と関連する日程・申込データを削除します。この操作は元に戻せません。')) return;
  const status = document.getElementById('db-admin-edit-status');
  status.textContent = '削除中...';
  dbAdminCall({ method: 'DELETE', path: '/tournaments/' + selected.id }, () => {
    dbAdminCloseEditor();
    dbAdminLoadPane('left');
    dbAdminLoadPane('right');
  }, error => {
    status.textContent = 'エラー: ' + error.message;
    status.className = 'op-status error';
  });
}

function dbAdminMethodChanged() {
  const method = document.getElementById('db-admin-method').value;
  document.getElementById('db-admin-body-wrap').style.display =
    method === 'GET' || method === 'DELETE' ? 'none' : 'flex';
  const run = document.getElementById('db-admin-run');
  run.textContent = method === 'GET' ? '取得' : '実行';
  run.classList.toggle('db-admin-danger', method === 'DELETE');
}

function dbAdminParseJson(id, emptyValue) {
  const text = document.getElementById(id).value.trim();
  if (!text) return emptyValue;
  try { return JSON.parse(text); }
  catch (e) { throw new Error(id === 'db-admin-query' ? '絞り込みJSONが不正です。' : 'Body JSONが不正です。'); }
}

function dbAdminExecute() {
  const method = document.getElementById('db-admin-method').value;
  const path = document.getElementById('db-admin-path').value.trim();
  const status = document.getElementById('db-admin-status');
  const output = document.getElementById('db-admin-response');
  let query;
  let body;
  try {
    query = dbAdminParseJson('db-admin-query', {});
    body = dbAdminParseJson('db-admin-body', {});
  } catch (e) {
    status.textContent = e.message;
    status.className = 'op-status error';
    return;
  }
  if (method !== 'GET' && !window.confirm(method + ' ' + path + ' をDBへ反映しますか？')) return;
  const button = document.getElementById('db-admin-run');
  button.disabled = true;
  status.textContent = '実行中...';
  dbAdminCall({ method, path, query, body }, data => {
    button.disabled = false;
    output.textContent = JSON.stringify(data, null, 2);
    status.textContent = '完了';
    status.className = 'op-status ok';
  }, error => {
    button.disabled = false;
    output.textContent = error.message;
    status.textContent = 'エラー: ' + error.message;
    status.className = 'op-status error';
  });
}
</script>
