<script>
// ============================================================
// メール管理ページ
// ============================================================

let _mmCurrentRowNum = null;
let _mmShowAll = false;
let _mmAllData = [];
let _mmDatabaseSyncPreviewValid = false;
let _mmGmailLinkPreviewValid = false;
let _mmGmailAuditData = null;
let _mmLoaded = false;
let _mmPendingReminderSelection = null;
let _mmCurrentPreview = null;

function mmEscAttr(value) {
  return escHtml(String(value || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ---- 初期化 ----
function initMailManagement() {
  if (_mmLoaded) {
    mmRenderTable();
    mmOpenPendingReminderSelection();
    return;
  }
  loadMailManagement();
}

function mmFindReminderRow(rows, tournamentName, grades) {
  const matches = (rows || []).filter(row =>
    String(row.tournamentName || '') === String(tournamentName || '')
    && String(row.grades || '') === String(grades || '')
    && String(row.mailType || '') === 'リマインダー'
  );
  matches.sort((left, right) => {
    const leftSent = String(left.sent || '').includes('済') ? 1 : 0;
    const rightSent = String(right.sent || '').includes('済') ? 1 : 0;
    if (leftSent !== rightSent) return leftSent - rightSent;
    return Number(right.rowNum || 0) - Number(left.rowNum || 0);
  });
  return matches[0] || null;
}

function mmSelectReminderAfterNavigation(
  tournamentName, grades, preferredSendDateTime
) {
  _mmPendingReminderSelection = {
    tournamentName: String(tournamentName || ''),
    grades: String(grades || ''),
    preferredSendDateTime: String(preferredSendDateTime || ''),
  };
  loadMailManagement();
}

function mmOpenPendingReminderSelection() {
  if (!_mmPendingReminderSelection || !_mmLoaded) return;
  const selection = _mmPendingReminderSelection;
  _mmPendingReminderSelection = null;
  const row = mmFindReminderRow(
    _mmAllData,
    selection.tournamentName,
    selection.grades
  );
  if (!row) {
    window.alert(
      selection.tournamentName + selection.grades
      + 'のリマインダー行が見つかりません。'
      + '「案内作成の内容から登録」または「行を追加」を使用してください。'
    );
    return;
  }
  mmOpenPreviewModal(
    row.rowNum,
    selection.preferredSendDateTime || row.sendDateTime,
    row.mailType
  );
}

// ---- データ読み込み ----
function loadMailManagement() {
  setStatus('mail-management', 'loading', '');
  google.script.run
    .withSuccessHandler(mmOnLoaded)
    .withFailureHandler(e => setStatus('mail-management', 'error', e.message))
    .getMailManagement();
}

function mmPreviewDatabaseSync() {
  const output = document.getElementById('mm-db-sync-preview');
  const details = document.getElementById('mm-db-sync-details');
  const status = document.getElementById('mm-db-sync-status');
  const runButton = document.getElementById('mm-db-sync-run');
  _mmDatabaseSyncPreviewValid = false;
  runButton.disabled = true;
  details.style.display = '';
  output.textContent = 'メール管理シートとDBを検査中...';
  status.textContent = '検査中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      output.textContent = JSON.stringify(data, null, 2);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      const summary = data.summary || {};
      if ((data.errors || []).length) {
        status.textContent = '同期できません：候補' + Number(summary.candidate_count || 0)
          + '件、対象外' + Number(summary.skipped_count || 0)
          + '件、エラー' + Number(summary.error_count || 0) + '件';
        status.className = 'op-status error';
        details.open = true;
        return;
      }
      _mmDatabaseSyncPreviewValid = true;
      runButton.disabled = !data.summary || data.summary.candidate_count === 0;
      status.textContent = '検査完了：同期候補' + Number(summary.candidate_count || 0)
        + '件、対象外' + Number(summary.skipped_count || 0) + '件';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      output.textContent = 'エラー: ' + error.message;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .previewMailManagementDatabaseSync();
}

function mmRunDatabaseSync() {
  if (!_mmDatabaseSyncPreviewValid) return;
  if (!window.confirm(
    '検査済みの未送信・未来日時のメール予定をDBへ同期します。'
    + 'この操作だけではGmailを送信しません。実行しますか？'
  )) return;
  const output = document.getElementById('mm-db-sync-preview');
  const details = document.getElementById('mm-db-sync-details');
  const status = document.getElementById('mm-db-sync-status');
  const runButton = document.getElementById('mm-db-sync-run');
  runButton.disabled = true;
  _mmDatabaseSyncPreviewValid = false;
  details.style.display = '';
  output.textContent = 'DBへ同期中...';
  status.textContent = 'DBへ同期中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      output.textContent = JSON.stringify(data, null, 2);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        details.open = true;
        return;
      }
      status.textContent = Number(data.created_or_existing_count || 0)
        + '件のメールジョブをDBへ同期しました。対象外'
        + Number(data.skipped_count || 0) + '件';
      status.className = 'op-status ok';
      loadMailManagement();
    })
    .withFailureHandler(error => {
      output.textContent = 'エラー: ' + error.message;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
      details.open = true;
    })
    .syncMailManagementDatabase();
}

function mmPreviewAnnouncementGmailLinks() {
  const output = document.getElementById('mm-gmail-link-preview');
  const details = document.getElementById('mm-gmail-link-details');
  const status = document.getElementById('mm-gmail-link-status');
  const runButton = document.getElementById('mm-gmail-link-run');
  _mmGmailLinkPreviewValid = false;
  runButton.disabled = true;
  details.style.display = '';
  output.textContent = 'DBの案内と送信済みGmailを検査中...';
  status.textContent = '検査中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      output.textContent = JSON.stringify(data, null, 2);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      const summary = data.summary || {};
      if ((data.errors || []).length) {
        status.textContent = '紐付けできません：候補' + Number(summary.candidate_count || 0)
          + '件、紐付け済み' + Number(summary.skipped_count || 0)
          + '件、エラー' + Number(summary.error_count || 0) + '件';
        status.className = 'op-status error';
        details.open = true;
        return;
      }
      _mmGmailLinkPreviewValid = true;
      runButton.disabled = Number(summary.candidate_count || 0) === 0;
      status.textContent = '検査完了：紐付け候補' + Number(summary.candidate_count || 0)
        + '件、紐付け済み' + Number(summary.skipped_count || 0) + '件';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      output.textContent = 'エラー: ' + error.message;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .previewAnnouncementGmailLinks();
}

function mmRunAnnouncementGmailLinks() {
  if (!_mmGmailLinkPreviewValid) return;
  if (!window.confirm(
    '検査済みの案内に送信済みGmailのメッセージIDを紐付けます。'
    + 'この操作ではGmailを送信しません。実行しますか？'
  )) return;
  const output = document.getElementById('mm-gmail-link-preview');
  const details = document.getElementById('mm-gmail-link-details');
  const status = document.getElementById('mm-gmail-link-status');
  const runButton = document.getElementById('mm-gmail-link-run');
  _mmGmailLinkPreviewValid = false;
  runButton.disabled = true;
  details.style.display = '';
  output.textContent = 'Gmail IDを紐付け中...';
  status.textContent = 'Gmail IDを紐付け中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      output.textContent = JSON.stringify(data, null, 2);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        details.open = true;
        return;
      }
      status.textContent = Number(data.linked_count || 0)
        + '件の案内にGmail IDを紐付けました。紐付け済み'
        + Number(data.already_linked_count || 0) + '件';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      output.textContent = 'エラー: ' + error.message;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
      details.open = true;
    })
    .linkAnnouncementGmailMessages();
}

function mmLoadGmailAudit() {
  const button = document.getElementById('mm-gmail-audit-load');
  const status = document.getElementById('mm-gmail-audit-status');
  button.disabled = true;
  status.textContent = 'DBとGmailを監査中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      button.disabled = false;
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      _mmGmailAuditData = data;
      mmRenderGmailAudit();
      const summary = data.summary || {};
      status.textContent = '案内' + Number(summary.announcement_count || 0)
        + '件、正常' + Number(summary.valid_count || 0)
        + '件、要確認' + Number(summary.unresolved_count || 0)
        + '件、案内未登録日程' + Number(summary.uncovered_schedule_count || 0) + '件';
      status.className = 'op-status '
        + (Number(summary.unresolved_count || 0)
          || Number(summary.uncovered_schedule_count || 0) ? 'error' : 'ok');
    })
    .withFailureHandler(error => {
      button.disabled = false;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .getAnnouncementGmailAudit();
}

function mmGmailAuditStatusLabel(status) {
  return {
    valid: '正常',
    unlinked: '未紐付け',
    missing: '保存IDを取得不能',
    mismatch: '件名・URL不一致',
  }[status] || status;
}

function mmRenderGmailAudit() {
  const results = document.getElementById('mm-gmail-audit-results');
  const tbody = document.getElementById('mm-gmail-audit-tbody');
  tbody.innerHTML = '';
  (_mmGmailAuditData.announcements || []).forEach(item => {
    const tr = document.createElement('tr');
    const candidates = item.candidates || [];
    const options = candidates.map(candidate =>
      '<option value="' + mmEscAttr(candidate.gmail_message_id) + '">'
        + escHtml(candidate.sent_at + ' / ' + candidate.gmail_message_id) + '</option>'
    ).join('');
    const current = item.gmail_message_id || '';
    tr.innerHTML =
      '<td><div>' + escHtml(item.subject) + '</div>'
        + (isSafeHttpUrl(item.form_url)
          ? '<a href="' + mmEscAttr(item.form_url)
            + '" target="_blank" rel="noopener">フォーム</a>'
          : '') + '</td>'
      + '<td>' + escHtml((item.schedule_ids || []).join(', ')) + '</td>'
      + '<td><strong>' + escHtml(mmGmailAuditStatusLabel(item.current_status)) + '</strong>'
        + (current ? '<br><small>' + escHtml(current) + '</small>' : '') + '</td>'
      + '<td><select class="me-select mm-gmail-audit-select">'
        + '<option value="">Gmail IDを選択または下欄へ入力</option>'
        + options + '</select>'
        + '<input class="fc-text-input mm-gmail-audit-input" type="text"'
        + ' placeholder="GmailメッセージID" value="'
        + mmEscAttr(candidates.length === 1
          ? candidates[0].gmail_message_id : '') + '"></td>'
      + '<td><button type="button" class="mm-add-row-btn mm-gmail-audit-save"'
        + '>検証して保存</button></td>';
    const select = tr.querySelector('.mm-gmail-audit-select');
    const input = tr.querySelector('.mm-gmail-audit-input');
    select.addEventListener('change', () => {
      if (select.value) input.value = select.value;
    });
    tr.querySelector('.mm-gmail-audit-save').addEventListener('click', () => {
      mmSaveGmailAuditLink(item.id, item.gmail_message_id, input.value);
    });
    tbody.appendChild(tr);
  });

  const uncovered = _mmGmailAuditData.uncovered_schedules || [];
  document.getElementById('mm-uncovered-schedules-summary').textContent =
    '案内未登録の日程（' + uncovered.length + '件）';
  document.getElementById('mm-uncovered-schedules').innerHTML = uncovered.length
    ? '<ul>' + uncovered.map(item =>
      '<li>' + escHtml(item.tournament_name + ' ' + item.grade + '級 '
        + item.held_on + '（schedule ' + item.schedule_id + '）') + '</li>'
    ).join('') + '</ul>'
    : '<p>案内未登録の日程はありません。</p>';
  results.style.display = '';
}

function mmSaveGmailAuditLink(announcementId, expectedId, messageId) {
  const value = String(messageId || '').trim();
  if (!value) {
    window.alert('GmailメッセージIDを選択または入力してください。');
    return;
  }
  if (!window.confirm(
    'Gmailの件名とフォームURLを再検証し、案内' + announcementId
    + 'のGmail IDを更新しますか？'
  )) return;
  const status = document.getElementById('mm-gmail-audit-status');
  status.textContent = 'Gmail IDを検証して保存中...';
  status.className = 'op-status db-admin-searching';
  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      if (data.error) {
        status.textContent = 'エラー: ' + data.error;
        status.className = 'op-status error';
        return;
      }
      status.textContent = 'Gmail IDを更新しました。監査結果を再読込します。';
      status.className = 'op-status ok';
      mmLoadGmailAudit();
    })
    .withFailureHandler(error => {
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .setAnnouncementGmailLinkManual(JSON.stringify({
      announcement_id: announcementId,
      gmail_message_id: value,
      expected_gmail_message_id: expectedId || null,
    }));
}

function mmOnLoaded(json) {
  const data = JSON.parse(json);
  if (data.error) { setStatus('mail-management', 'error', data.error); return; }

  _mmAllData = data;
  _mmLoaded = true;
  mmRenderTable();
  mmOpenPendingReminderSelection();
}

function mmToggleShowAll() {
  _mmShowAll = !_mmShowAll;
  const btn = document.getElementById('mm-show-all-btn');
  btn.textContent = _mmShowAll ? '未送信のみ表示' : '全ての行を表示';
  btn.classList.toggle('mm-toggle-btn-active', _mmShowAll);
  mmRenderTable();
}

function mmRenderTable() {
  const rows = _mmShowAll ? _mmAllData : _mmAllData.filter(row => !row.sent || !row.sent.includes('済'));

  if (rows.length === 0) {
    setStatus('mail-management', 'info', '送信予定のメールはありません');
    return;
  }

  const statusEl = document.getElementById('mail-management-status');
  const tableEl  = document.getElementById('mail-management-table');
  statusEl.style.display = 'none';
  tableEl.style.display  = '';

  const tbody = document.getElementById('mm-tbody');
  tbody.innerHTML = '';

  rows.forEach(row => {
    const tr = document.createElement('tr');

    const isSent       = row.sent && row.sent.includes('済');
    const isReminderSet = row.reminderSet && row.reminderSet.includes('済');

    tr.innerHTML = `
      <td>${escHtml(row.tournamentName)}</td>
      <td>${escHtml(row.grades)}</td>
      <td class="mm-datetime">${escHtml(row.sendDateTime) || '未設定'}</td>
      <td><span class="mm-badge mm-badge-${row.mailType === 'リマインダー' ? 'reminder' : 'payment'}">${escHtml(row.mailType)}</span></td>
      <td class="mm-truncate">${escHtml(row.threadTitle)}</td>
      <td class="mm-truncate">${isSafeHttpUrl(row.formLink) ? `<a href="${escAttr(row.formLink)}" target="_blank" rel="noopener">リンク</a>` : ''}</td>
      <td class="mm-center">${isReminderSet ? '<span class="mm-check">済</span>' : '<span class="mm-pending">—</span>'}</td>
      <td class="mm-center">${isSent ? '<span class="mm-check">済</span>' : '<span class="mm-pending">—</span>'}</td>
      <td class="mm-center">
        <button class="mm-set-btn" data-row-num="${Number(row.rowNum)}">${isReminderSet || isSent ? '再設定' : '設定'}</button>
        <button class="mm-del-btn">削除</button>
      </td>
    `;
    tr.querySelector('.mm-set-btn').addEventListener('click', () => {
      mmOpenPreviewModal(row.rowNum, row.sendDateTime, row.mailType);
    });
    tr.querySelector('.mm-del-btn').addEventListener('click', () => {
      mmDeleteRow(row.rowNum);
    });
    if (row.mailType === 'リマインダー') {
      tr.classList.add('mm-previewable-row');
      tr.tabIndex = 0;
      tr.title = 'クリックして現在の送信内容を確認';
      const openPreview = event => {
        if (event.target.closest('button, a')) return;
        if (event.type === 'keydown'
            && event.key !== 'Enter' && event.key !== ' ') return;
        if (event.type === 'keydown') event.preventDefault();
        mmOpenPreviewModal(row.rowNum, row.sendDateTime, row.mailType);
      };
      tr.addEventListener('click', openPreview);
      tr.addEventListener('keydown', openPreview);
    }
    tbody.appendChild(tr);
  });
}

// ---- プレビューモーダル ----
function mmOpenPreviewModal(rowNum, currentDatetime, mailType) {
  _mmCurrentRowNum = rowNum;
  _mmCurrentPreview = null;
  const isPayment = mailType === '振込確認';

  document.getElementById('mm-preview-title').textContent =
    isPayment ? '振込確認' : 'リマインダー確認';
  document.getElementById('mm-preview-body').value = '';
  document.getElementById('mm-preview-meta').textContent = '';
  document.getElementById('mm-preview-draft-status').textContent = '';
  const draftButton = document.getElementById('mm-create-draft-btn');
  draftButton.style.display = isPayment ? 'none' : '';
  draftButton.disabled = true;
  draftButton.textContent = 'Gmail下書きを作成';
  document.getElementById('mm-include-not-paid').checked = false;
  let iso = (currentDatetime || '').replace(' ', 'T').slice(0, 16);
  if (!iso || new Date(iso) <= new Date()) {
    const defaultHour   = isPayment ? 7  : 8;
    const defaultMinute = isPayment ? 50 : 0;
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(defaultHour, defaultMinute, 0, 0);
    const pad = n => String(n).padStart(2, '0');
    iso = `${tomorrow.getFullYear()}-${pad(tomorrow.getMonth() + 1)}-${pad(tomorrow.getDate())}T${pad(defaultHour)}:${pad(defaultMinute)}`;
  }
  document.getElementById('mm-preview-datetime').value = iso;

  // 振込確認はプレビュー不要
  document.getElementById('mm-preview-section').style.display = isPayment ? 'none' : '';
document.getElementById('mm-preview-modal').style.display = 'flex';

  if (!isPayment) mmRefreshPreview();
}

function mmRefreshPreview() {
  _mmCurrentPreview = null;
  document.getElementById('mm-create-draft-btn').disabled = true;
  document.getElementById('mm-preview-draft-status').textContent = '';
  const includeNotPaid = document.getElementById('mm-include-not-paid').checked;
  const datetimeVal    = document.getElementById('mm-preview-datetime').value;
  const sendDateTime   = datetimeVal ? datetimeVal.replace('T', ' ') + ':00' : null;
  document.getElementById('mm-preview-body').value = '読み込み中...';
  google.script.run
    .withSuccessHandler(mmOnPreviewLoaded)
    .withFailureHandler(e => {
      document.getElementById('mm-preview-body').value = 'エラー: ' + e.message;
    })
    .getReminderPreview(JSON.stringify({ rowNum: _mmCurrentRowNum, includeNotPaid, sendDateTime }));
}

function mmOnPreviewLoaded(json) {
  const data = JSON.parse(json);
  if (data.error) {
    _mmCurrentPreview = null;
    document.getElementById('mm-preview-body').value = 'エラー: ' + data.error;
    return;
  }
  _mmCurrentPreview = data;
  const meta = `送信予定: ${data.sendDateFormatted}　種別: ${data.mailType}　対象: ${data.tournamentName}${data.grades}`;
  document.getElementById('mm-preview-meta').textContent = meta;
  document.getElementById('mm-preview-body').value = data.body;
  if (data.mailType === 'リマインダー') {
    document.getElementById('mm-create-draft-btn').disabled = false;
  }
}

function mmClosePreviewModal(e) {
  if (e && e.target !== document.getElementById('mm-preview-modal')) return;
  document.getElementById('mm-preview-modal').style.display = 'none';
  _mmCurrentRowNum = null;
  _mmCurrentPreview = null;
}

function mmCreateReminderDraft() {
  if (!_mmCurrentRowNum || !_mmCurrentPreview
      || _mmCurrentPreview.mailType !== 'リマインダー') return;
  const datetimeVal = document.getElementById('mm-preview-datetime').value;
  const sendDateTime = datetimeVal
    ? datetimeVal.replace('T', ' ') + ':00' : '';
  const includeNotPaid =
    document.getElementById('mm-include-not-paid').checked;
  const button = document.getElementById('mm-create-draft-btn');
  const status = document.getElementById('mm-preview-draft-status');
  button.disabled = true;
  button.textContent = '作成中...';
  status.textContent = '';
  google.script.run
    .withSuccessHandler(json => {
      const result = JSON.parse(json);
      button.textContent = 'Gmail下書きを作成';
      if (result.error) {
        button.disabled = false;
        status.textContent = 'エラー: ' + result.error;
        status.className = 'op-status error';
        return;
      }
      status.textContent = 'Gmail下書きを作成しました。';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      button.disabled = false;
      button.textContent = 'Gmail下書きを作成';
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .createReminderDraftFromPreview(JSON.stringify({
      rowNum: _mmCurrentRowNum,
      includeNotPaid: includeNotPaid,
      sendDateTime: sendDateTime,
    }));
}

function mmConfirmSetTrigger() {
  if (!_mmCurrentRowNum) return;
  const includeNotPaid = document.getElementById('mm-include-not-paid').checked;
  const datetimeVal = document.getElementById('mm-preview-datetime').value;
  if (!datetimeVal) { alert('送信予定日時を入力してください'); return; }
  const sendDateTime = datetimeVal.replace('T', ' ') + ':00';

  const btn = document.querySelector('#mm-preview-modal .mm-btn-primary');
  btn.disabled = true;
  btn.textContent = '設定中...';

  google.script.run
    .withSuccessHandler(json => {
      const data = JSON.parse(json);
      btn.disabled = false;
      btn.textContent = 'リマインダーを設定する';
      if (data.error) { alert('エラー: ' + data.error); return; }
      document.getElementById('mm-preview-modal').style.display = 'none';
      _mmCurrentRowNum = null;
      loadMailManagement();
    })
    .withFailureHandler(e => {
      btn.disabled = false;
      btn.textContent = 'リマインダーを設定する';
      alert('エラー: ' + e.message);
    })
    .setReminderTrigger(JSON.stringify({ rowNum: _mmCurrentRowNum, includeNotPaid, sendDateTime }));
}

function mmShowAddModal() {
  mmShowAddModalPrefilled('', '', 'リマインダー', '');
}

function mmDatetimeBeforeDate(dateText, daysBefore, hour, minute) {
  const match = String(dateText || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return '';
  const date = new Date(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3]),
    Number(hour),
    Number(minute),
    0,
    0
  );
  date.setDate(date.getDate() - Number(daysBefore || 0));
  const pad = value => String(value).padStart(2, '0');
  return date.getFullYear()
    + '-' + pad(date.getMonth() + 1)
    + '-' + pad(date.getDate())
    + 'T' + pad(date.getHours())
    + ':' + pad(date.getMinutes());
}

function mmScheduledDateTimeFromInternalDeadline(internalDeadline, mailType) {
  const isPayment = mailType === '振込確認';
  return mmDatetimeBeforeDate(
    internalDeadline,
    isPayment ? 0 : 1,
    isPayment ? 7 : 8,
    isPayment ? 50 : 0
  );
}

function mmPopulateAddTournamentSelect(selectedFullName) {
  const sel = document.getElementById('mm-add-tournament-select');
  const tournaments = (allTournaments || []).slice();
  if (selectedFullName && !tournaments.some(t => t.name === selectedFullName)) {
    tournaments.unshift({ name: selectedFullName });
  }
  sel.innerHTML = '<option value="">-- 大会を選択 --</option>' +
    tournaments.map(t =>
      `<option value="${escHtml(t.name)}"${t.name === selectedFullName ? ' selected' : ''}>${escHtml(t.name)}</option>`
    ).join('');
}

function mmShowAddFromMakeEmail() {
  const title = document.getElementById('me-title')?.value?.trim() || '';
  const activeGrades = typeof meGetActiveGrades === 'function'
    ? meGetActiveGrades() : [];
  const grades = activeGrades.join('') + (activeGrades.length ? '級' : '');
  const formArea = document.getElementById('me-form-area');
  const hasMakeEmailInput = title && grades
    && formArea && formArea.style.display !== 'none';

  if (!hasMakeEmailInput) {
    window.alert(
      '案内作成タブに参照できる大会名・級がありません。'
      + '先に案内作成タブで案内メールまたは振込案内を入力してください。'
    );
    return;
  }
  if (_meActiveTab !== 0 && _meActiveTab !== 1) {
    window.alert(
      'メール管理へ登録できるのは「案内メール」または「振込案内」です。'
    );
    return;
  }

  const isPayment = _meActiveTab === 1;
  const mailType = isPayment ? '振込確認' : 'リマインダー';
  const threadTitle = isPayment
    ? title + grades + '\u3000出場者確定のお知らせ'
    : title + grades + '\u3000案内';
  const paymentDeadline = isPayment
    ? (document.getElementById('me-pay-real')?.value || '')
    : '';
  const internalDeadline = document.getElementById(
    isPayment ? 'me-pay-kaInai' : 'me-apply-kaInai'
  )?.value || '';
  if (!internalDeadline) {
    window.alert(
      '案内作成タブで'
      + (isPayment ? '振込会内期限' : '参加表明締切（会内）')
      + 'を入力してください。'
      + (isPayment
        ? '送信予定日時は、その当日に自動設定されます。'
        : '送信予定日時は、その前日に自動設定されます。')
    );
    return;
  }
  const sendDateTime = mmScheduledDateTimeFromInternalDeadline(
    internalDeadline, mailType
  );
  const formLink = document.getElementById('me-form-url')?.value?.trim() || '';

  mmShowAddModalPrefilled(
    title,
    grades,
    mailType,
    threadTitle,
    paymentDeadline,
    formLink,
    true,
    sendDateTime
  );
}

function mmOnAddTournamentChange() {
  const fullName = document.getElementById('mm-add-tournament-select').value;
  const m = fullName.match(/([A-E]+級)$/);
  const grades = m ? m[1] : '';
  const title  = grades ? fullName.slice(0, -grades.length) : fullName;
  document.getElementById('mm-add-tournament').value = title;
  document.getElementById('mm-add-grades').value     = grades;
  mmUpdateAddModalExtras(title, grades);
}

function mmOnAddTypeChange() {
  const fullName = document.getElementById('mm-add-tournament-select').value;
  const m = fullName.match(/([A-E]+級)$/);
  const grades = m ? m[1] : '';
  const title  = grades ? fullName.slice(0, -grades.length) : fullName;

  // 種別に応じて時刻を更新（日付はそのまま）
  const type = document.getElementById('mm-add-type').value;
  const defaultHour   = type === '振込確認' ? 7  : 8;
  const defaultMinute = type === '振込確認' ? 50 : 0;
  const pad = n => String(n).padStart(2, '0');
  const current = document.getElementById('mm-add-datetime').value;
  const datePart = current ? current.slice(0, 11) : (() => {
    const d = new Date(); d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T`;
  })();
  document.getElementById('mm-add-datetime').value = datePart + `${pad(defaultHour)}:${pad(defaultMinute)}`;

  mmUpdateAddModalExtras(title, grades);
}

function mmUpdateAddModalExtras(title, grades) {
  const type = document.getElementById('mm-add-type').value;
  const isPayment = type === '振込確認';

  // 振込確認は件名・フォームリンク欄を非表示・空欄
  document.getElementById('mm-add-thread-row').style.display   = isPayment ? 'none' : '';
  document.getElementById('mm-add-formlink-row').style.display = isPayment ? 'none' : '';
  document.getElementById('mm-add-payment-deadline-row').style.display = isPayment ? '' : 'none';
  document.getElementById('mm-add-thread').value   = '';
  document.getElementById('mm-add-formlink').value = '';

  if (!isPayment && title) {
    // リマインダー：件名を自動入力
    document.getElementById('mm-add-thread').value = title + grades + '\u3000案内';
    // フォームURLを取得
    google.script.run
      .withSuccessHandler(res => {
        const r = JSON.parse(res);
        if (r.formUrl) document.getElementById('mm-add-formlink').value = r.formUrl;
      })
      .getFormUrl(title + grades);
  }
}

function mmShowAddModalPrefilled(
  tournamentName,
  grades,
  mailType,
  threadTitle,
  paymentDeadline,
  formLink,
  fromMakeEmail,
  preferredSendDateTime
) {
  const type = mailType || 'リマインダー';
  const defaultHour   = type === '振込確認' ? 7  : 8;
  const defaultMinute = type === '振込確認' ? 50 : 0;
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const pad = n => String(n).padStart(2, '0');
  const defaultDatetime = preferredSendDateTime
    || `${tomorrow.getFullYear()}-${pad(tomorrow.getMonth() + 1)}-${pad(tomorrow.getDate())}T${pad(defaultHour)}:${pad(defaultMinute)}`;

  const fullName = (tournamentName || '') + (grades || '');
  mmPopulateAddTournamentSelect(fullName);
  document.getElementById('mm-add-tournament').value = tournamentName || '';
  document.getElementById('mm-add-grades').value     = grades || '';
  document.getElementById('mm-add-datetime').value   = defaultDatetime;
  document.getElementById('mm-add-type').value      = type;
  document.getElementById('mm-add-payment-deadline').value = paymentDeadline || '';
  document.getElementById('mm-add-modal-title').textContent = fromMakeEmail
    ? '案内作成の内容を登録'
    : 'メール予定を登録';
  document.getElementById('mm-add-modal-prompt').textContent = fromMakeEmail
    ? '案内作成タブの入力内容を参照しました。この内容をメール管理に登録しますか？'
    : '入力した内容をメール管理に登録しますか？';
  document.getElementById('mm-add-submit-btn').textContent = '登録する';
  document.getElementById('mm-add-modal').style.display = 'flex';
  // 種別に応じて件名・フォームリンクを初期化
  mmUpdateAddModalExtras(tournamentName || '', grades || '');
  if (threadTitle && type !== '振込確認') {
    document.getElementById('mm-add-thread').value = threadTitle;
  }
  if (formLink && type !== '振込確認') {
    document.getElementById('mm-add-formlink').value = formLink;
  }
}

function mmCloseAddModal(e) {
  if (e && e.target !== document.getElementById('mm-add-modal')) return;
  document.getElementById('mm-add-modal').style.display = 'none';
}

function mmSubmitAdd() {
  const tournamentName = document.getElementById('mm-add-tournament').value.trim();
  const grades         = document.getElementById('mm-add-grades').value.trim();
  const sendDateTime   = document.getElementById('mm-add-datetime').value;
  const mailType       = document.getElementById('mm-add-type').value;
  const threadTitle    = document.getElementById('mm-add-thread').value.trim();
  const formLink       = document.getElementById('mm-add-formlink').value.trim();
  const paymentDeadline = document.getElementById('mm-add-payment-deadline').value;

  if (!tournamentName || !sendDateTime) {
    alert('大会を選択し、送信予定日時を入力してください');
    return;
  }
  if (mailType === '振込確認' && !paymentDeadline) {
    alert('振込期限を入力してください');
    return;
  }

  const btn = document.getElementById('mm-add-submit-btn');
  btn.disabled = true;
  btn.textContent = '登録中...';

  google.script.run
    .withSuccessHandler(json => {
      btn.disabled = false;
      btn.textContent = '登録する';
      const data = JSON.parse(json);
      if (data.error) { alert('エラー: ' + data.error); return; }
      document.getElementById('mm-add-modal').style.display = 'none';
      loadMailManagement();
    })
    .withFailureHandler(e => {
      btn.disabled = false;
      btn.textContent = '登録する';
      alert('エラー: ' + e.message);
    })
    .addMailManagementRow(JSON.stringify({
      tournamentName, grades, sendDateTime, mailType, threadTitle, formLink, paymentDeadline,
    }));
}
