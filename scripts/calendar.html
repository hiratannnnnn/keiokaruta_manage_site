<script>
// ------------------------------------------------------------
// 役職選択（アクセス認証はGoogle側で実施）
// ------------------------------------------------------------
const SELECTABLE_ROLES = ['申込係', '振込係', '案内係', '会長副会長'];
let currentRole = '申込係';
let appInitialized = false;

function selectLoginRole(btn) {
  document.querySelectorAll('.login-role-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRole = btn.dataset.role;
}

function showReloginOverlay() {
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('login-cancel-btn').style.display = appInitialized ? 'block' : 'none';
}

function cancelRelogin() {
  document.getElementById('login-overlay').style.display = 'none';
}

function submitRoleSelection() {
  document.getElementById('login-overlay').style.display = 'none';
  const badge = document.getElementById('current-role-badge');
  badge.textContent = currentRole;
  badge.style.display = 'inline-block';
  try {
    localStorage.setItem('karuta_role', currentRole);
  } catch(e) {}
  if (!appInitialized) {
    initApp();
    appInitialized = true;
  } else {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelector('[data-page="calendar"]').classList.add('active');
    document.getElementById('page-calendar').classList.add('active');
    document.getElementById('calendar-detail-view').classList.remove('active');
    document.getElementById('calendar-list-view').style.display = '';
    initApp();
  }
}

function restorePreviousRoleAndStart() {
  let savedRole = '';
  try {
    // 旧版が保存した平文パスワードは使用しない。
    localStorage.removeItem('karuta_pw');
    savedRole = String(localStorage.getItem('karuta_role') || '');
  } catch (e) {
    return false;
  }

  // localStorageは利用者が変更できるため、表示用として許可済みの役職だけを復元する。
  if (!SELECTABLE_ROLES.includes(savedRole)) {
    if (savedRole) {
      try { localStorage.removeItem('karuta_role'); } catch (e) {}
    }
    return false;
  }
  const roleBtn = document.querySelector(`.login-role-btn[data-role="${savedRole}"]`);
  if (!roleBtn) return false;
  selectLoginRole(roleBtn);
  submitRoleSelection();
  return true;
}

// ------------------------------------------------------------
// 大会一覧
// ------------------------------------------------------------
let allTournaments = [];
let currentTournamentApplyStart = '';
let currentTournamentIsOfficial = true;

function loadCalendar() {
  if (calendarLoading) return;
  calendarLoading = true;
  setStatus('calendar', 'loading');
  google.script.run
    .withSuccessHandler(onCalendarLoaded)
    .withFailureHandler(err => {
      calendarLoading = false;
      calendarLoaded = false;
      setStatus('calendar', 'error', err.message);
    })
    .getTournamentList();
}

function onCalendarLoaded(json) {
  calendarLoading = false;
  let data;
  try {
    data = JSON.parse(json);
  } catch (e) {
    calendarLoaded = false;
    setStatus('calendar', 'error', '大会一覧の応答を解析できませんでした。');
    return;
  }
  if (data.error) {
    calendarLoaded = false;
    setStatus('calendar', 'error', data.error);
    return;
  }
  calendarLoaded = true;
  allTournaments = data;
  renderCalendar(allTournaments);
  mePopulateTournamentSelect();
  mePopulateParticipantContactTournaments();
}

// 日付文字列に応じた td クラスを返す（過去=灰、4日以内=薄赤、それ以降=黄）
function dateTdClass(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.replace(/\//g, '-'));
  if (isNaN(d.getTime())) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = (d - today) / 86400000;
  if (diff < 0)  return 'date-past';
  if (diff <= 4) return 'date-soon';
  return 'date-future';
}

function renderCalendar(list) {
  if (!list.length) {
    document.getElementById('calendar-count').style.display = 'none';
    setStatus('calendar', 'empty', 'データがありません');
    return;
  }

  document.getElementById('calendar-tbody').innerHTML =
    list.map(t => {
      const safeName = escAttr(t.name);
      const bothDone    = t.applyDone && t.payDone;

      // 済ボタンのレンダリングヘルパー
      const doneBtn = (col, isDone) => {
        if (isDone && col === 12) {
          // 振込済みは取り消し可能
          return `<button class="done-btn done-btn-done" data-name="${safeName}" onclick="clearCalendarPayDone(this.dataset.name, this)">✓</button>`;
        }
        const cls = isDone ? 'done-btn done-btn-done' : 'done-btn';
        const txt = isDone ? '✓' : '済';
        const dis = isDone ? 'disabled' : '';
        return `<button class="${cls}" ${dis} data-name="${safeName}" onclick="setCalendarDone(this.dataset.name, ${col}, this)">${txt}</button>`;
      };

      // 案内ダブルチェックセル
      let dcCell;
      if (t.doubleChecked) {
        dcCell = `<td><span class="dc-done">✓</span></td>`;
      } else {
        dcCell = `<td onclick="event.stopPropagation()"><button class="dc-btn" data-name="${safeName}" onclick="openDoubleCheckModal(this.dataset.name)">チェック</button></td>`;
      }

      return `<tr class="clickable" data-name="${safeName}" onclick="openTournamentDetail(this.dataset.name)">
        <td>${escHtml(t.name)}</td>
        ${dcCell}
        <td class="${dateTdClass(t.applyStart)}">${escHtml(t.applyStart)}</td>
        <td class="${dateTdClass(t.applyDeadline)}">${escHtml(t.applyDeadline)}</td>
        <td onclick="event.stopPropagation()">${doneBtn(7, t.applyDone)}</td>
        <td class="${dateTdClass(t.lottery)}">${escHtml(t.lottery)}</td>
        <td class="${dateTdClass(t.payDeadline)}">${escHtml(t.payDeadline)}</td>
        <td onclick="event.stopPropagation()">${doneBtn(12, t.payDone)}</td>
        <td class="${dateTdClass(t.date)}">${escHtml(t.date)}</td>
        <td onclick="event.stopPropagation()">
          <button class="complete-btn" data-name="${safeName}" onclick="completeTournament(this.dataset.name, this)" ${bothDone ? '' : 'disabled'}>完了</button>
        </td>
      </tr>`;
    }).join('');

  document.getElementById('calendar-status').style.display = 'none';
  document.getElementById('calendar-table').style.display = 'table';
  const badge = document.getElementById('calendar-count');
  badge.textContent = list.length + ' 件';
  badge.style.display = 'inline-block';
}

// ------------------------------------------------------------
// 権限チェック・エラー表示・確認モーダル
// ------------------------------------------------------------
let _confirmAction = null;

function showAlertModal(msg, title) {
  document.getElementById('alert-modal-title').textContent = title || 'エラー';
  document.getElementById('alert-modal-message').textContent = msg;
  document.getElementById('alert-modal').style.display = 'flex';
}

function closeAlertModal() {
  document.getElementById('alert-modal').style.display = 'none';
}

function onAlertOverlayClick(e) {
  if (e.target === document.getElementById('alert-modal')) closeAlertModal();
}

// 入力モーダル
let _inputAction = null;

function showInputModal(title, message, onConfirm) {
  _inputAction = onConfirm;
  document.getElementById('input-modal-title').textContent   = title;
  document.getElementById('input-modal-message').textContent = message;
  document.getElementById('input-modal-field').value         = '';
  document.getElementById('input-modal-error').textContent   = '';
  document.getElementById('input-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('input-modal-field').focus(), 50);
}

function closeInputModal() {
  document.getElementById('input-modal').style.display = 'none';
  _inputAction = null;
}

function onInputOverlayClick(e) {
  if (e.target === document.getElementById('input-modal')) closeInputModal();
}

function executeInputAction() {
  const val   = document.getElementById('input-modal-field').value.trim();
  const errEl = document.getElementById('input-modal-error');
  if (!val || !/^\d+$/.test(val)) {
    errEl.textContent = '半角数字で入力してください';
    return;
  }
  const action = _inputAction;
  closeInputModal();
  if (action) action(val);
}

function showConfirmModal(message, onConfirm) {
  _confirmAction = onConfirm;
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-modal').style.display = 'flex';
}

function executeConfirmedAction() {
  closeConfirmModal();
  if (_confirmAction) { _confirmAction(); _confirmAction = null; }
}

function closeConfirmModal() {
  document.getElementById('confirm-modal').style.display = 'none';
}

function onConfirmOverlayClick(e) {
  if (e.target === document.getElementById('confirm-modal')) closeConfirmModal();
}

function setCalendarDone(name, col, btn) {
  const label   = col === 7 ? '申込済' : '振込済';

  showConfirmModal(`「${name}」の${label}を入力しますか？`, () => {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        const r = JSON.parse(res);
        if (r.error) {
          btn.disabled = false;
          showAlertModal('エラー: ' + r.error);
          return;
        }
        btn.textContent = '✓';
        btn.classList.add('done-btn-done');
        if (col === 12) {
          btn.onclick = function() { clearCalendarPayDone(name, this); };
        }
        const row     = btn.closest('tr');
        const allDone = Array.from(row.querySelectorAll('.done-btn'))
                             .every(b => b.classList.contains('done-btn-done'));
        if (allDone) row.querySelector('.complete-btn').disabled = false;
      })
      .withFailureHandler(e => {
        btn.disabled = false;
        showAlertModal('エラー: ' + e.message);
      })
      .setCalendarColumn(name, col, '済');
  });
}

function triggerPayDoneFromDetail() {
  const name     = document.getElementById('detail-title').textContent;
  const btn      = document.getElementById('btn-pay-done');
  const statusEl = document.getElementById('pay-done-status');

  setDetailOperationState(btn, statusEl, 'running',
    '振込対象を集計しています…', '集計中…');

  google.script.run
    .withSuccessHandler(res => {
      if (!isCurrentTournamentDetail(name)) return;
      const r = JSON.parse(res);
      if (r.error) {
        setDetailOperationState(btn, statusEl, 'error',
          '集計に失敗しました。再試行できます：' + r.error);
        return;
      }
      setDetailOperationState(btn, statusEl, 'idle', '');
      const gradeRows = (r.grades || []).map(g =>
        `<tr><td style="padding:3px 8px;font-weight:600;">${escHtml(g.grade)}</td>` +
        `<td style="padding:3px 8px;">${g.names.map(escHtml).join('、')}</td>` +
        `<td style="padding:3px 8px;text-align:right;">${g.fee.toLocaleString()}円×${g.names.length}</td></tr>`
      ).join('');
      document.getElementById('pay-done-summary').innerHTML =
        `<strong>${escHtml(name)}</strong><br>` +
        `参加者：${r.count} 人　合計金額：${r.total.toLocaleString()} 円` +
        (gradeRows ? `<table style="margin-top:10px;width:100%;border-collapse:collapse;font-size:0.9rem;">${gradeRows}</table>` : '');
      document.getElementById('pay-done-check').checked = false;
      document.getElementById('pay-done-confirm-btn').disabled = true;
      document.getElementById('pay-done-modal').style.display = 'flex';
    })
    .withFailureHandler(e => {
      if (!isCurrentTournamentDetail(name)) return;
      setDetailOperationState(btn, statusEl, 'error',
        '集計に失敗しました。再試行できます：' + e.message);
    })
    .getTournamentPaySummary(name);
}

function onPayDoneCheckChange() {
  document.getElementById('pay-done-confirm-btn').disabled =
    !document.getElementById('pay-done-check').checked;
}

function closePayDoneModal() {
  document.getElementById('pay-done-modal').style.display = 'none';
}

function onPayDoneModalOverlayClick(e) {
  if (e.target === document.getElementById('pay-done-modal')) closePayDoneModal();
}

function executePayDone() {
  const name     = document.getElementById('detail-title').textContent;
  const btn      = document.getElementById('btn-pay-done');
  const statusEl = document.getElementById('pay-done-status');
  closePayDoneModal();

  setDetailOperationState(btn, statusEl, 'running',
    '振込記録を登録しています…', '登録中…');

  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      const isCurrentDetail = document.getElementById('detail-title').textContent === name;
      if (r.error) {
        if (isCurrentDetail) {
          setDetailOperationState(btn, statusEl, 'error',
            '登録に失敗しました。再試行できます：' + r.error);
        }
        return;
      }
      _suAllData = null;
      const t = allTournaments.find(x => x.name === name);
      if (t) {
        t.payDone = true;
        renderCalendar(allTournaments);
      }
      if (isCurrentDetail) {
        setDetailOperationState(btn, statusEl, 'success',
          '振込記録を登録しました ✓', '振込記録済み ✓');
        btn.disabled = true;
        updateDetailCompletionAvailability(t);
      }
    })
    .withFailureHandler(e => {
      if (document.getElementById('detail-title').textContent !== name) return;
      setDetailOperationState(btn, statusEl, 'error',
        '登録に失敗しました。再試行できます：' + e.message);
    })
    .setCalendarColumn(name, 12, '済');
}

function triggerCompleteTournamentFromDetail() {
  const name = document.getElementById('detail-title').textContent;
  const btn = document.getElementById('btn-complete-detail');
  const status = document.getElementById('complete-detail-status');
  showConfirmModal(`「${name}」を完了にしますか？\n一覧から非表示になります。`, () => {
    setDetailOperationState(btn, status, 'running',
      '大会の完了処理を実行しています…', '完了処理中…');
    google.script.run
      .withSuccessHandler(res => {
        const r = JSON.parse(res);
        if (r.error) {
          setDetailOperationState(btn, status, 'error',
            '完了処理に失敗しました。再試行できます：' + r.error);
          return;
        }
        setDetailOperationState(btn, status, 'success',
          '大会を完了しました ✓', '完了済み ✓');
        allTournaments = allTournaments.filter(x => x.name !== name);
        renderCalendar(allTournaments);
        showCalendarList();
        showAlertModal('大会を完了しました。', '完了');
      })
      .withFailureHandler(e => {
        setDetailOperationState(btn, status, 'error',
          '完了処理に失敗しました。再試行できます：' + e.message);
      })
      .completeTournament(name);
  });
}

function clearCalendarPayDone(name, btn) {
  showConfirmModal(`「${name}」の振込済みを取り消しますか？`, () => {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        const r = JSON.parse(res);
        if (r.error) { showAlertModal('エラー: ' + r.error); return; }
        btn.textContent = '済';
        btn.classList.remove('done-btn-done');
        btn.onclick = function() { setCalendarDone(name, 12, this); };
        btn.closest('tr').querySelector('.complete-btn').disabled = true;
        _suAllData = null;
      })
      .withFailureHandler(e => {
        btn.disabled = false;
        showAlertModal('エラー: ' + e.message);
      })
      .setCalendarColumn(name, 12, '');
  });
}

// ------------------------------------------------------------
// 完了ボタン
// ------------------------------------------------------------
function completeTournament(name, btn) {

  showConfirmModal(`「${name}」を完了にしますか？\n一覧から非表示になります。`, () => {
    btn.disabled = true;
    btn.textContent = '...';
    google.script.run
      .withSuccessHandler(res => {
        const r = JSON.parse(res);
        if (r.error) {
          btn.disabled = false;
          btn.textContent = '完了';
          showAlertModal('エラー: ' + r.error);
          return;
        }
        allTournaments = allTournaments.filter(t => t.name !== name);
        renderCalendar(allTournaments);
      })
      .withFailureHandler(e => {
        btn.disabled = false;
        btn.textContent = '完了';
        showAlertModal('エラー: ' + e.message);
      })
      .completeTournament(name);
  });
}

// ------------------------------------------------------------
// 大会詳細
// ------------------------------------------------------------
let detailColsHidden = false;
let detailSheetVersion = 1;
let detailSelectionStatusIndex = 7;
let detailPaymentStatusIndex = 8;
let detailNameColumnIndex = 2;
let detailPendingNotice = null;
let detailRequestSequence = 0;
let detailParticipationOverview = null;

function detailParticipationNormalizeName(name) {
  return String(name || '').replace(/[ 　]+/g, '').trim().toLowerCase();
}

function detailParticipationCurrentState(name, requestId) {
  return detailParticipationOverview
    && detailParticipationOverview.tournamentName === name
    && detailParticipationOverview.requestId === requestId;
}

function detailParticipationFiscalYear(tournament) {
  const match = String(tournament && tournament.date || '')
    .match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (!match) return null;
  const year = Number(match[1]);
  return Number(match[2]) < 4 ? year - 1 : year;
}

function prefetchDetailParticipationOverview(name, requestId, fiscalYear) {
  detailParticipationOverview = {
    tournamentName: name,
    requestId,
    fiscalYear,
    applicants: [],
    matrix: null,
    loading: true,
    error: '',
  };
  const button = document.getElementById('detail-participation-btn');
  button.disabled = true;

  const cached = participationMatrixGetCachedData(fiscalYear);
  if (cached) {
    detailParticipationOverview.matrix = cached;
    detailParticipationOverview.loading = false;
    renderDetailParticipationOverview();
    return;
  }
  const cacheGeneration = participationMatrixCacheGeneration;

  google.script.run
    .withSuccessHandler(json => {
      if (cacheGeneration !== participationMatrixCacheGeneration) return;
      if (!detailParticipationCurrentState(name, requestId)) return;
      let data;
      try {
        data = JSON.parse(json);
      } catch (e) {
        detailParticipationOverview.loading = false;
        detailParticipationOverview.error =
          '出場大会データの応答を解析できませんでした。';
        renderDetailParticipationOverview();
        return;
      }
      detailParticipationOverview.loading = false;
      if (data.error) {
        detailParticipationOverview.error = data.error;
      } else {
        participationMatrixCacheData(data);
        detailParticipationOverview.matrix = data;
      }
      renderDetailParticipationOverview();
    })
    .withFailureHandler(error => {
      if (cacheGeneration !== participationMatrixCacheGeneration) return;
      if (!detailParticipationCurrentState(name, requestId)) return;
      detailParticipationOverview.loading = false;
      detailParticipationOverview.error = error.message;
      renderDetailParticipationOverview();
    })
    .getParticipationMatrix(fiscalYear);
}

function setDetailOperationState(button, status, state, message, buttonText) {
  if (!button.dataset.defaultText) button.dataset.defaultText = button.textContent;
  button.disabled = state === 'running';
  button.textContent = buttonText || button.dataset.defaultText;
  button.classList.toggle('op-btn-done', state === 'success');
  status.textContent = message || '';
  status.className = 'op-status'
    + (state === 'success' ? ' ok' : (state === 'error' ? ' error'
      : (state === 'running' ? ' running' : '')));
}

function isCurrentTournamentDetail(name) {
  return document.getElementById('calendar-detail-view').classList.contains('active')
    && document.getElementById('detail-title').textContent === name;
}

function updateDetailCompletionAvailability(tournament) {
  const completeButton = document.getElementById('btn-complete-detail');
  const canComplete = Boolean(tournament && tournament.applyDone && tournament.payDone);
  completeButton.disabled = !canComplete;
  completeButton.textContent = canComplete
    ? '大会を完了とする'
    : '申込済・振込済の入力後に完了可能';
  completeButton.title = canComplete
    ? '大会を一覧から完了扱いにします'
    : '大会一覧で申込済と振込済を入力してください';
}

function openTournamentDetail(name) {
  const requestId = ++detailRequestSequence;
  const t = allTournaments.find(x => x.name === name);
  document.getElementById('calendar-list-view').style.display = 'none';
  document.getElementById('calendar-detail-view').classList.add('active');
  document.getElementById('detail-title').textContent = name;
  document.getElementById('detail-title-badges').innerHTML = '';
  prefetchDetailParticipationOverview(
    name, requestId, detailParticipationFiscalYear(t)
  );

  // 左側リセット
  document.getElementById('detail-grade-section').style.display = 'none';
  document.getElementById('detail-person-section').style.display = 'none';
  const statusEl = document.getElementById('detail-status');
  statusEl.style.display = 'block';
  statusEl.className = 'status';
  statusEl.innerHTML = '<span class="spinner"></span> 参加者データを読み込み中...';

  // 操作パネルは詳細データ取得後に表示
  document.getElementById('detail-ops-section').style.display = 'none';

  // 右側：一覧から取得済みのデータを即時表示
  if (t) {
    currentTournamentApplyStart = t.applyStart || '';
    renderStatusTable([
      { key: '大会日時', value: t.date },
      { key: '申込開始', value: t.applyStart },
      { key: '申込期限', value: t.applyDeadline },
      { key: '抽選日',   value: t.lottery },
      { key: '振込期限', value: t.payDeadline },
    ].filter(r => r.value));
    document.getElementById('detail-title-badges').innerHTML =
      computeTournamentBadges(t).map(b => `<span class="detail-badge ${b.cls}">${escHtml(b.label)}</span>`).join('');
    renderDetailTasks(name);
  }

  // トグル状態リセット（デフォルト：非表示）
  detailColsHidden = true;
  document.getElementById('toggle-cols-btn').textContent = '詳細列を表示';

  google.script.run
    .withSuccessHandler(json => {
      if (requestId !== detailRequestSequence
          || document.getElementById('detail-title').textContent !== name) return;
      onDetailLoaded(json);
    })
    .withFailureHandler(err => {
      if (requestId !== detailRequestSequence
          || document.getElementById('detail-title').textContent !== name) return;
      if (detailPendingNotice && detailPendingNotice.tournamentName === name) {
        detailPendingNotice = null;
      }
      statusEl.className = 'status error';
      statusEl.textContent = 'エラー: ' + err.message;
    })
    .getTournamentDetail(name);
}

function renderStatusTable(rows) {
  document.getElementById('detail-status-loading').style.display = 'none';
  document.getElementById('detail-bottom-right-tbody').innerHTML =
    rows.map(r => {
      const cls = dateTdClass(r.value);
      return `<tr><td>${escHtml(r.key)}</td><td class="${cls}">${escHtml(r.value)}</td></tr>`;
    }).join('');
  document.getElementById('detail-status-table').style.display = 'table';
}

function onDetailLoaded(json) {
  const statusEl = document.getElementById('detail-status');
  let res;
  try {
    res = JSON.parse(json);
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = '詳細データの読み込み結果を解釈できませんでした。';
    return;
  }

  if (res.error) {
    statusEl.className = 'status error';
    statusEl.textContent = 'エラー: ' + res.error;
    return;
  }

  statusEl.style.display = 'none';
  detailSheetVersion = Number(res.sheetVersion) || 1;
  detailPaymentStatusIndex = Number.isInteger(res.paymentStatusIndex)
    ? res.paymentStatusIndex
    : 8;
  detailSelectionStatusIndex = Number.isInteger(res.selectionStatusIndex)
    ? res.selectionStatusIndex
    : detailPaymentStatusIndex - 1;
  detailNameColumnIndex = Number.isInteger(res.nameColumnIndex)
    ? res.nameColumnIndex
    : 2;

  // グレードサマリー
  const gradeSummary = res.gradeSummary || [];
  renderGradeSummary(gradeSummary);

  // 参加者一覧
  const payColIdx = detailPaymentStatusIndex;
  const selectionColIdx = detailSelectionStatusIndex;
  const showPayBtns = true;
  document.getElementById('detail-person-thead').innerHTML =
    '<tr>' + res.personHeaders.map((h, i) => {
      if (i === payColIdx) {
        return `<th>${escHtml(h)}</th>`
          + (showPayBtns ? '<th>操作</th><th>キャンセル</th>' : '');
      }
      return `<th>${escHtml(h)}</th>`;
    }).join('') + '</tr>';
  const personRecords = Array.isArray(res.personRecords)
    ? res.personRecords
    : (res.personRows || []).map((values, index) => ({
        source_row: index + 2,
        entry_id: '',
        name: String(values[detailNameColumnIndex] || ''),
        selection_status: String(values[selectionColIdx] || ''),
        selection_display_status: String(values[selectionColIdx] || ''),
        payment_display_status: String(values[payColIdx] || ''),
        cancellation_status: 'none',
        cancellation_label: 'キャンセルなし',
        values,
      }));
  if (detailParticipationOverview
      && detailParticipationOverview.tournamentName
        === document.getElementById('detail-title').textContent) {
    detailParticipationOverview.applicants = personRecords.slice();
    document.getElementById('detail-participation-btn').disabled =
      personRecords.length === 0;
    renderDetailParticipationOverview();
  }
  document.getElementById('detail-person-tbody').innerHTML =
    personRecords.map(record => {
      const row = record.values || [];
      const name = String(record.name || row[detailNameColumnIndex] || '');
      const cancellationRowClass = record.cancellation_status === 'before'
        ? 'cancel-row-before detail-cancel-before'
        : '';
      return `<tr class="${cancellationRowClass}">` + row.map((cell, i) => {
        if (i === detailNameColumnIndex) {
          return `<td class="name-link" title="選手大会照会で検索" data-player-name="${escAttr(name)}" onclick="goToPlayerSearch(this.dataset.playerName)">${escHtml(cell)}</td>`;
        }
        if (i === selectionColIdx) {
          const cancellationClass = record.cancellation_status === 'before'
            ? 'cancel-status-cell cancel-status-before'
            : '';
          return `<td class="${cancellationClass}">${escHtml(String(cell))}</td>`;
        }
        if (i === payColIdx) {
          return `<td>${escHtml(String(cell))}</td>`
            + (showPayBtns ? renderEntryActionCells(record, name) : '');
        }
        return `<td>${escHtml(cell)}</td>`;
      }).join('') + '</tr>';
    }).join('');
  document.getElementById('detail-person-section').style.display = 'block';
  applyDetailColsState();


  // ステータス（シートから取得した詳細版で上書き）
  if (res.bottomRight.length) {
    renderStatusTable(res.bottomRight);
  }

  // 公認/非公認判定：サーバー側で registerDatabase 直下行 col[1] を参照済み
  currentTournamentIsOfficial = res.isOfficial;
  showOfficialBadge(!res.isOfficial);

  document.getElementById('detail-ops-section').style.display = 'grid';
  [
    'toggle-official-status',
    'delete-status',
    'pay-done-status',
    'complete-detail-status',
  ].forEach(id => {
    const status = document.getElementById(id);
    status.textContent = '';
    status.className = 'op-status';
  });
  document.getElementById('detail-delete-section').style.display = 'block';
  document.getElementById('btn-pay-done').style.display = 'block';
  document.getElementById('detail-complete-section').style.display = 'block';
  [
    ['btn-toggle-official', '公認状態を切替'],
    ['btn-complete-detail', '大会を完了とする'],
    ['btn-delete', '大会データ・シート・フォームを削除'],
  ].forEach(([id, label]) => {
    const button = document.getElementById(id);
    button.disabled = false;
    button.textContent = label;
    button.dataset.defaultText = label;
    button.classList.remove('op-btn-done');
  });
  const tournament = allTournaments.find(item =>
    item.name === document.getElementById('detail-title').textContent
  );
  updateDetailCompletionAvailability(tournament);
  const payButton = document.getElementById('btn-pay-done');
  if (tournament && tournament.payDone) {
    payButton.textContent = '振込記録済み ✓';
    payButton.classList.add('op-btn-done');
    payButton.disabled = true;
  } else {
    payButton.textContent = '大会への振込み';
    payButton.classList.remove('op-btn-done');
    payButton.disabled = false;
  }
  if (detailPendingNotice
      && detailPendingNotice.tournamentName
        === document.getElementById('detail-title').textContent) {
    const notice = detailPendingNotice;
    detailPendingNotice = null;
    const noticeStatus = document.getElementById(notice.statusId);
    if (noticeStatus) {
      noticeStatus.textContent = notice.message;
      noticeStatus.className = 'op-status ok';
    }
  }
}

function openDetailParticipationModal() {
  const state = detailParticipationOverview;
  if (!state || !state.applicants.length) return;

    state.tournamentName + '：申込者の出場大会';

function closeDetailParticipationModal(event) {
  if (event && event.target !==
      document.getElementById('detail-participation-modal')) return;
  document.getElementById('detail-participation-modal').style.display = 'none';
}

function detailParticipationPlayerMaps(matrix) {
  const byId = {};
  const byName = {};
  (matrix.players || []).forEach(player => {
    byId[String(player.id)] = player;
    const key = detailParticipationNormalizeName(player.name);
    if (!byName[key]) byName[key] = [];
    byName[key].push(player);
  });
  return { byId, byName };
}

function detailParticipationResolvePlayer(applicant, maps) {
  const playerId = String(applicant.player_id || '');
  if (playerId) {
    return maps.byId[playerId] || {
      id: playerId,
      sanctionedCount: null,
    };
  }
  const matches = maps.byName[
    detailParticipationNormalizeName(applicant.name)
  ] || [];
  return matches.length === 1 ? matches[0] : null;
}

function detailParticipationTournamentLabel(tournament, participation) {
  const name = String(tournament && tournament.name || '不明な大会');
  if (participation.mark === 'unsanctioned') return '（' + name + '）';
  if (participation.mark === 'mixed') return name + '（非公認を含む）';
  return name;
}

function detailParticipationSanctionedCount(player, items) {
  if (player.sanctionedCount !== null
      && player.sanctionedCount !== undefined) {
    return Number(player.sanctionedCount || 0);
  }
  return items.reduce((count, item) => {
    const scheduleIds = Array.isArray(item.sanctioned_schedule_ids)
      ? item.sanctioned_schedule_ids : [];
    if (scheduleIds.length) return count + scheduleIds.length;
    return count + (item.mark === 'sanctioned' ? 1 : 0);
  }, 0);
}

function detailParticipationTournamentDate(tournament) {
  const heldOn = tournament && Array.isArray(tournament.heldOn)
    ? tournament.heldOn : [];
  return heldOn.map(String).filter(Boolean).sort()[0] || '9999-99-99';
}

function detailParticipationCompareChronologically(
  left, right, tournamentsById
) {
  const leftTournament = tournamentsById[String(left.tournament_id)] || {};
  const rightTournament = tournamentsById[String(right.tournament_id)] || {};
  return detailParticipationTournamentDate(leftTournament).localeCompare(
    detailParticipationTournamentDate(rightTournament)
  ) || String(leftTournament.name || '').localeCompare(
    String(rightTournament.name || ''), 'ja'
  ) || String(left.tournament_id).localeCompare(String(right.tournament_id));
}

function renderDetailParticipationOverview() {
  const state = detailParticipationOverview;
  if (!state) return;
  const status = document.getElementById('detail-participation-status');
  const tbody = document.getElementById('detail-participation-tbody');
  tbody.replaceChildren();

  if (!state.applicants.length) {
    status.className = 'status';
    status.textContent = '参加者データを読み込み中...';
    return;
  }

  const matrix = state.matrix;
  const maps = matrix ? detailParticipationPlayerMaps(matrix) : null;
  const tournamentsById = {};
  const participationsByPlayer = {};
  if (matrix) {
    (matrix.tournaments || []).forEach(tournament => {
      tournamentsById[String(tournament.id)] = tournament;
    });
    (matrix.participations || []).forEach(participation => {
      const playerId = String(participation.player_id);
      if (!participationsByPlayer[playerId]) {
        participationsByPlayer[playerId] = [];
      }
      participationsByPlayer[playerId].push(participation);
    });
  }

  state.applicants.forEach(applicant => {
    const row = document.createElement('tr');
    const player = maps
      ? detailParticipationResolvePlayer(applicant, maps) : null;
    const baseValues = [
      applicant.name || '（氏名なし）',
      applicant.grade ? applicant.grade + '級' : '',
      applicant.selection_display_status || '',
    ];
    baseValues.forEach(value => {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.appendChild(cell);
    });

    const countCell = document.createElement('td');
    const tournamentsCell = document.createElement('td');
    if (state.loading) {
      countCell.textContent = '取得中...';
      tournamentsCell.textContent = '取得中...';
    } else if (state.error) {
      countCell.textContent = '—';
      tournamentsCell.textContent = '取得エラー';
    } else if (!player) {
      countCell.textContent = '—';
      tournamentsCell.textContent = '選手を特定できません';
    } else {
      const items = (participationsByPlayer[String(player.id)] || [])
        .slice().sort((left, right) =>
          detailParticipationCompareChronologically(
            left, right, tournamentsById
          )
        );
      countCell.textContent = String(
        detailParticipationSanctionedCount(player, items)
      );
      const history = document.createElement('div');
      history.className = 'detail-participation-history-cell';
      history.textContent = items.length
        ? items.map(item => detailParticipationTournamentLabel(
            tournamentsById[String(item.tournament_id)], item
          )).join('、')
        : 'なし';
      tournamentsCell.appendChild(history);
    }
    row.appendChild(countCell);
    row.appendChild(tournamentsCell);
    tbody.appendChild(row);
  });

  if (state.loading) {
    status.className = 'status';
    status.innerHTML = '<span class="spinner"></span> 出場大会を先読み中...';
  } else if (state.error) {
    status.className = 'status error';
    status.textContent = 'エラー: ' + state.error;
  } else {
    const truncated = matrix.truncated === true;
    status.className = 'detail-participation-note'
      + (truncated ? ' detail-participation-warning' : '');
    status.textContent = Number(matrix.fiscalYear)
      + '年度の公認大会出場回数です。非公認大会は（ ）で表示しています。'
      + (truncated
        ? ' APIの取得上限に達したため、一部の回数・大会が不足している可能性があります。'
        : '');
  }
}

function triggerToggleOfficial() {

  const btn    = document.getElementById('btn-toggle-official');

  setDetailOperationState(btn, status, 'running', '公認状態を変更しています…', '変更中…');

function triggerDeleteTournament() {
  const name     = document.getElementById('detail-title').textContent;
  const btn      = document.getElementById('btn-delete');
  const statusEl = document.getElementById('delete-status');

  showConfirmModal(
    `「${name}」が担当するDB日程と申込を削除し、シートとGoogleフォームをゴミ箱に移動します。\n同じ大会に別フォームの日程が残る場合、大会本体と兄弟フォームは維持されます。最後の日程なら大会本体も削除されます。\nこの操作は復元できません。\n\n※通常は大会一覧の「完了」ボタンをご利用ください。`,
    () => {
      setDetailOperationState(btn, statusEl, 'running',
        '大会データを削除しています…', '削除中…');
      google.script.run
        .withSuccessHandler(res => {
          const r = JSON.parse(res);
          if (r.error) {
            if (r.partial) {
              participationMatrixInvalidateCache();
              detailParticipationOverview = null;
            }
            setDetailOperationState(btn, statusEl, 'error',
              '削除に失敗しました。再試行できます：' + r.error);
            return;
          }
          participationMatrixInvalidateCache();
          detailParticipationOverview = null;
          allTournaments = allTournaments.filter(t => t.name !== name);
          showCalendarList();
          renderCalendar(allTournaments);
          showAlertModal(
            r.tournament_deleted
              ? '担当日程と大会本体、シート、フォームを削除しました。'
              : '担当日程、シート、フォームを削除しました。兄弟フォームの大会データは維持されています。',
            '削除完了'
          );
        })
        .withFailureHandler(e => {
          setDetailOperationState(btn, statusEl, 'error',
            '削除に失敗しました。再試行できます：' + e.message);
        })
        .deleteTournament(name);
    }
  );
}

function renderPayButtonsHtml(
  selectionValue, paymentValue, playerName, sourceRow, entryId, playerId,
  cancellationStatus
) {
  const identity = `data-player-name="${escAttr(playerName)}" data-source-row="${escAttr(sourceRow)}" data-entry-id="${escAttr(entryId)}" data-player-id="${escAttr(playerId)}"`;
  const isZumi = paymentValue.includes('済') || paymentValue.includes('過払い');
  const isWaitlisted = selectionValue.includes('キャンセル待ち');
  if (detailSheetVersion !== 2) {
    return '<span class="pay-recorded-note">v2移行後に利用できます</span>';
  }
  if (!entryId) {
    return '<span class="detail-badge badge-warning">DB未登録</span>';
  }
  const selectionAction = isWaitlisted
    ? `<button class="pay-btn pay-btn-clear" ${identity} onclick="event.stopPropagation();setPayStatusFromButton(this,'')">出場可能</button>`
    : `<button class="pay-btn pay-btn-cancel" ${identity} onclick="event.stopPropagation();setPayStatusCancelFromButton(this)">キャンセル待ち</button>`;
  // 公開前・区分不明のキャンセルは支払い操作を抑止する。
  // 公開後キャンセルは参加費を徴収する場合があるため、支払い操作を許可する。
  if (cancellationStatus !== 'none' && cancellationStatus !== 'after') {
    return '';
  }
  const paymentAction = isZumi || paymentValue.includes('繰り越し')
    ? ''
    : `<button class="pay-btn" ${identity} onclick="event.stopPropagation();setPayStatusFromButton(this,'済')">振込済み</button>`
      + `<button class="pay-btn pay-btn-deposit" ${identity} onclick="event.stopPropagation();setPayStatusFromButton(this,'繰り越し')">繰り越し</button>`;
  const actionHtml = cancellationStatus === 'after'
    ? paymentAction
    : selectionAction + paymentAction;
  return `<div class="entry-action-frame">${actionHtml}</div>`;
}

function renderEntryActionCells(record, playerName) {
  const selectionValue = String(record.selection_status || '');
  const paymentValue = String(record.payment_display_status || '');
  const cancellationStatus = String(record.cancellation_status || 'none');
  const cancellationLabel = String(
    record.cancellation_label || 'キャンセルなし'
  );
  const canceled = cancellationStatus !== 'none';
  const identity = `data-player-name="${escAttr(playerName)}" data-source-row="${escAttr(record.source_row)}" data-entry-id="${escAttr(record.entry_id)}" data-player-id="${escAttr(record.player_id)}" data-paid-yen="${escAttr(record.paid_yen || 0)}"`;
  const actions = renderPayButtonsHtml(
    selectionValue, paymentValue, playerName, record.source_row,
    record.entry_id, record.player_id, cancellationStatus
  );
  if (!record.entry_id || detailSheetVersion !== 2) {
    return `<td class="pay-cell">${actions}</td><td class="cancel-action-cell">—</td>`;
  }
  const statusClass = cancellationStatus === 'before'
    ? 'cancel-status-before'
    : cancellationStatus === 'after'
      ? 'cancel-status-after' : 'badge-muted';
  const status = `<span class="cancel-status ${statusClass}">現在：${escHtml(cancellationLabel)}</span>`;
  const cancelButtons =
      `<button class="pay-btn pay-btn-cancel-before ${cancellationStatus === 'before' ? 'is-active' : ''}" ${identity} onclick="event.stopPropagation();openEntryCancellationModal(this,'before')">公開前</button>`
    + `<button class="pay-btn pay-btn-cancel-after ${cancellationStatus === 'after' ? 'is-active' : ''}" ${identity} onclick="event.stopPropagation();openEntryCancellationModal(this,'after')">公開後</button>`
    + (canceled
      ? `<button class="pay-btn pay-btn-clear" ${identity} onclick="event.stopPropagation();openEntryCancellationModal(this,'clear')">解除</button>`
      : '');
  return `<td class="pay-cell">${actions}</td>`
    + `<td class="cancel-action-cell">${status}<div>${cancelButtons}</div></td>`;
}

let _depositChoiceCallback = null;

function showDepositChoiceModal(message, callback) {
  _depositChoiceCallback = callback;
  document.getElementById('deposit-choice-message').textContent = message;
  document.getElementById('deposit-choice-modal').style.display = 'flex';
}

function executeDepositChoice(useDeposit) {
  document.getElementById('deposit-choice-modal').style.display = 'none';
  if (_depositChoiceCallback) { _depositChoiceCallback(useDeposit); _depositChoiceCallback = null; }
}

function _doSetPayStatus(tournamentName, identity, value, btn, useDeposit) {
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false;
      const r = JSON.parse(res);
      if (r.error) { showAlertModal('エラー: ' + r.error); return; }
      if (value === '済') _suAllData = null;
      openTournamentDetail(tournamentName);
    })
    .withFailureHandler(e => {
      btn.disabled = false;
      showAlertModal('エラー: ' + e.message);
    })
    .setDetailPayStatus(
      tournamentName, identity.sourceRow, identity.entryId, value, useDeposit
    );
}

function setPayStatusFromButton(btn, value) {
  const identity = detailIdentityFromButton(btn);
  const playerName = identity.playerName;
  const tournamentName = document.getElementById('detail-title').textContent;
  const label = value === '' ? '出場可能' : `「${value}」`;
  const statusKind = value === '済' || value === '繰り越し'
    ? '支払状態' : '選考状態';
  showConfirmModal(`「${playerName}」の${statusKind}を${label}にしますか？`, () => {
    if (value !== '済' && value !== '繰り越し') {
      _doSetPayStatus(tournamentName, identity, value, btn, false);
      return;
    }
    if (value === '繰り越し') {
      _doSetPayStatus(tournamentName, identity, value, btn, true);
      return;
    }
    // 済の場合：デポジット存在確認
    google.script.run
      .withSuccessHandler(res => {
        const r = JSON.parse(res);
        if (r.error || !r.deposit) {
          _doSetPayStatus(tournamentName, identity, value, btn, false);
          return;
        }
        showDepositChoiceModal(
          `${playerName} さんのデポジット（${r.deposit.amount.toLocaleString()}円）が存在します。\nここから使いますか？`,
          useDeposit => _doSetPayStatus(tournamentName, identity, value, btn, useDeposit)
        );
      })
      .withFailureHandler(() => {
        _doSetPayStatus(tournamentName, identity, value, btn, false);
      })
      .getPlayerDeposit(identity.playerId, playerName);
  });
}

let _entryCancellationTarget = null;

function openEntryCancellationModal(btn, timing) {
  const identity = detailIdentityFromButton(btn);
  identity.paidYen = Number(btn.dataset.paidYen || 0);
  _entryCancellationTarget = { btn, identity, timing };
  const labels = {
    before: '公開前キャンセル',
    after: '公開後キャンセル',
    clear: 'キャンセル解除',
  };
  document.getElementById('entry-cancellation-title').textContent = labels[timing];
  document.getElementById('entry-cancellation-message').textContent =
    `「${identity.playerName}」を${labels[timing]}に変更します。`;
  const depositRow = document.getElementById('entry-cancellation-deposit-row');
  const deposit = document.getElementById('entry-cancellation-deposit');
  deposit.checked = timing !== 'clear' && identity.paidYen > 0;
  depositRow.style.display =
    timing !== 'clear' && identity.paidYen > 0 ? 'flex' : 'none';
  document.getElementById('entry-cancellation-modal').style.display = 'flex';
}

function closeEntryCancellationModal() {
  document.getElementById('entry-cancellation-modal').style.display = 'none';
  _entryCancellationTarget = null;
}

function executeEntryCancellation() {
  const target = _entryCancellationTarget;
  if (!target) return;
  const tournamentName = document.getElementById('detail-title').textContent;
  const moveToDeposit = target.timing !== 'clear'
    && document.getElementById('entry-cancellation-deposit').checked;
  target.btn.disabled = true;
  google.script.run
    .withSuccessHandler(res => {
      target.btn.disabled = false;
      const result = JSON.parse(res);
      if (result.error) {
        showAlertModal('エラー: ' + result.error);
        return;
      }
      _suAllData = null;
      closeEntryCancellationModal();
      openTournamentDetail(tournamentName);
    })
    .withFailureHandler(error => {
      target.btn.disabled = false;
      showAlertModal('エラー: ' + error.message);
    })
    .setEntryCancellationStatus(
      tournamentName, target.identity.sourceRow, target.identity.entryId,
      target.timing, moveToDeposit
    );
}

let _entryPaymentDetail = null;

function entryPaymentMethodLabel(method) {
  const labels = {
    bank_transfer: '振込',
    cash: '現金',
    deposit: '繰り越し（デポジット）',
    carried_over: '繰り越し',
    adjustment: '調整',
  };
  return labels[String(method || '')] || String(method || '');
}

function openEntryPaymentDetail(btn) {
  const identity = detailIdentityFromButton(btn);
  _entryPaymentDetail = {
    entryId: identity.entryId,
    playerName: identity.playerName,
  };
  document.getElementById('entry-payment-detail-title').textContent =
    `${identity.playerName}：支払詳細`;
  document.getElementById('entry-payment-detail-content').innerHTML =
    '<span class="spinner"></span> 読み込み中...';
  document.getElementById('entry-payment-detail-modal').style.display = 'flex';
  google.script.run
    .withSuccessHandler(res => {
      const result = JSON.parse(res);
      if (result.error) {
        document.getElementById('entry-payment-detail-content').textContent =
          'エラー: ' + result.error;
        return;
      }
      renderEntryPaymentDetail(result.payment);
    })
    .withFailureHandler(error => {
      document.getElementById('entry-payment-detail-content').textContent =
        'エラー: ' + error.message;
    })
    .getEntryPaymentDetail(identity.entryId);
}

function renderEntryPaymentDetail(payment) {
  if (!_entryPaymentDetail) return;
  const activePayments = (payment.payments || []).filter(item =>
    !item.reversed_at
  );
  const summary =
    `<div class="entry-payment-summary">請求 ${Number(payment.participation_fee_yen || 0).toLocaleString()}円`
    + ` ／ 入金 ${Number(payment.paid_yen || 0).toLocaleString()}円`
    + ` ／ 残額 ${Number(payment.balance_yen || 0).toLocaleString()}円</div>`;
  const rows = activePayments.length
    ? activePayments.map(item =>
        '<tr>'
        + `<td>${escHtml(entryPaymentMethodLabel(item.method))}</td>`
        + `<td>${Number(item.amount_yen || 0).toLocaleString()}円</td>`
        + `<td>${escHtml(String(item.paid_at || ''))}</td>`
        + '<td>'
        + `<button class="pay-btn pay-btn-clear" data-payment-id="${escAttr(item.id)}" onclick="reverseEntryPaymentFromModal(this)">取消</button>`
        + '</td></tr>'
      ).join('')
    : '<tr><td colspan="4">有効な支払履歴はありません。</td></tr>';
  document.getElementById('entry-payment-detail-content').innerHTML =
    summary
    + '<table class="sheet-table entry-payment-table">'
    + '<thead><tr><th>方法</th><th>金額</th><th>日時</th><th></th></tr></thead>'
    + `<tbody>${rows}</tbody></table>`;
}

function reverseEntryPaymentFromModal(btn) {
  if (!_entryPaymentDetail) return;
  const paymentId = String(btn.dataset.paymentId || '');
  const entryId = _entryPaymentDetail.entryId;
  showConfirmModal('この支払履歴を取り消しますか？', () => {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        const result = JSON.parse(res);
        if (result.error) {
          showAlertModal('エラー: ' + result.error);
          return;
        }
        _suAllData = null;
        renderEntryPaymentDetail(result.payment);
      })
      .withFailureHandler(error => {
        btn.disabled = false;
        showAlertModal('エラー: ' + error.message);
      })
      .reverseEntryPaymentFromDetail(entryId, paymentId);
  });
}

function closeEntryPaymentDetail() {
  document.getElementById('entry-payment-detail-modal').style.display = 'none';
  _entryPaymentDetail = null;
  const tournamentName = document.getElementById('detail-title').textContent;
  if (tournamentName) openTournamentDetail(tournamentName);
}

// ------------------------------------------------------------
// ステータスバッジ生成
// ------------------------------------------------------------
function computeTournamentBadges(t) {
  const badges = [];
  const today  = new Date(); today.setHours(0, 0, 0, 0);
  const parse  = s => { if (!s) return null; const d = new Date(s.replace(/\//g, '-')); return isNaN(d) ? null : d; };

  const applyStart    = parse(t.applyStart);
  const applyDeadline = parse(t.applyDeadline);
  const lottery       = parse(t.lottery);
  const payDeadline   = parse(t.payDeadline);
  const date          = parse(t.date);

  // 申込状態
  if (t.applyDone) {
    badges.push({ label: '申込済み', cls: 'badge-done' });
  } else if (applyStart && today < applyStart) {
    badges.push({ label: '申込前', cls: 'badge-muted' });
  } else if (applyDeadline && today <= applyDeadline) {
    badges.push({ label: '申込受付中', cls: 'badge-active' });
  } else if (applyDeadline && today > applyDeadline) {
    badges.push({ label: '申込締切', cls: 'badge-muted' });
  }

  // 振込状態
  if (t.payDone) {
    badges.push({ label: '振込済み', cls: 'badge-done' });
  } else if (lottery && today >= lottery && (!payDeadline || today <= payDeadline)) {
    badges.push({ label: '振込中', cls: 'badge-warning' });
  } else if (payDeadline && today > payDeadline) {
    badges.push({ label: '振込締切', cls: 'badge-muted' });
  }

  // 大会直前（7日以内）
  if (date) {
    const diff = (date - today) / 86400000;
    if (diff >= 0 && diff <= 7) badges.push({ label: '大会直前', cls: 'badge-danger' });
  }

  return badges;
}

let _doubleCheckTarget = null;

function openDoubleCheckModal(name) {
  _doubleCheckTarget = name;
  document.getElementById('double-check-name').textContent = name;
  const t = allTournaments.find(x => x.name === name);
  const content = document.getElementById('double-check-content');
  if (t && t.announcementHtml) {
    setSanitizedRichText(content, t.announcementHtml);
  } else {
    content.textContent = '案内コンテンツがありません';
  }
  document.getElementById('double-check-modal').style.display = 'flex';
}

function closeDoubleCheckModal() {
  document.getElementById('double-check-modal').style.display = 'none';
  _doubleCheckTarget = null;
}

function onDoubleCheckOverlayClick(e) {
  if (e.target === document.getElementById('double-check-modal')) closeDoubleCheckModal();
}

function executeDoubleCheck() {
  const name = _doubleCheckTarget;
  closeDoubleCheckModal();
  if (!name) return;
  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      if (r.error) { showAlertModal('エラー: ' + r.error); return; }
      const t = allTournaments.find(x => x.name === name);
      if (t) t.doubleChecked = true;
      renderCalendar(allTournaments);
      // 詳細ページが同じ大会を表示中なら必要タスクを更新
      if (document.getElementById('detail-title').textContent === name) {
        renderDetailTasks(name);
      }
    })
    .withFailureHandler(e => { showAlertModal('エラー: ' + e.message); })
    .setCalendarColumn(name, 2, 'レ');
}

function renderDetailTasks(name) {
  const t       = allTournaments.find(x => x.name === name);
  const section = document.getElementById('detail-tasks-section');
  if (!t) { section.style.display = 'none'; return; }

  const safeName = escAttr(name);
  const items = [];

  if (!t.doubleChecked) {
    const btnHtml = `<button class="task-btn" data-name="${safeName}" onclick="openDoubleCheckModal(this.dataset.name)">チェック</button>`;
    items.push(`<div class="task-item"><span class="task-label">□ 案内のダブルチェック</span>${btnHtml}</div>`);
  }

  if (!items.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('detail-tasks-list').innerHTML = items.join('');
}

// ------------------------------------------------------------
// 級別サマリー
// ------------------------------------------------------------
let _gradeSummaryData = [];

function renderGradeSummary(gradeSummary) {
  _gradeSummaryData = gradeSummary;
  if (!gradeSummary.length) {
    document.getElementById('detail-grade-section').style.display = 'none';
    return;
  }
  document.getElementById('detail-grade-tbody').innerHTML = gradeSummary.map((g, idx) =>
    `<tr>
      <td><strong>${escHtml(g.grade)}級</strong></td>
      <td class="grade-fee-cell" onclick="startGradeFeeEdit(${idx}, this)"
          style="cursor:pointer;" title="クリックで編集">
        ${g.fee.toLocaleString()} 円
      </td>
      <td>${g.count} 人</td>
      <td id="grade-total-${idx}">${g.total.toLocaleString()} 円</td>
      <td>${escHtml(g.date)}</td>
    </tr>`
  ).join('');
  document.getElementById('detail-grade-section').style.display = 'block';
}

function startGradeFeeEdit(idx, cell) {
  const g = _gradeSummaryData[idx];
  cell.onclick = null;
  cell.innerHTML =
    `<input type="number" class="grade-fee-input" value="${g.fee}" min="0" step="100"
            style="width:80px;font-size:inherit;"
            onblur="commitGradeFeeEdit(${idx}, this)"
            onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelGradeFeeEdit(${idx},this);">`;
  const input = cell.querySelector('input');
  input.focus();
  input.select();
}

function cancelGradeFeeEdit(idx, input) {
  const g    = _gradeSummaryData[idx];
  const cell = input.closest('td');
  cell.innerHTML = `${g.fee.toLocaleString()} 円`;
  cell.onclick = function() { startGradeFeeEdit(idx, this); };
  cell.style.cursor = 'pointer';
  cell.title = 'クリックで編集';
}

function commitGradeFeeEdit(idx, input) {
  const newFee = parseInt(input.value, 10);
  const g      = _gradeSummaryData[idx];
  const cell   = input.closest('td');

  if (isNaN(newFee) || newFee < 0) {
    cancelGradeFeeEdit(idx, input);
    return;
  }
  if (newFee === g.fee) {
    cancelGradeFeeEdit(idx, input);
    return;
  }

  cell.textContent = '保存中...';
  cell.onclick = null;

  const name = document.getElementById('detail-title').textContent;
  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      if (r.error) {
        showAlertModal('エラー: ' + r.error);
        cell.innerHTML = `${g.fee.toLocaleString()} 円`;
      } else {
        g.fee   = newFee;
        g.total = newFee * g.count;
        cell.innerHTML = `${newFee.toLocaleString()} 円`;
        document.getElementById(`grade-total-${idx}`).textContent = g.total.toLocaleString() + ' 円';
      }
      cell.onclick = function() { startGradeFeeEdit(idx, this); };
      cell.style.cursor = 'pointer';
      cell.title = 'クリックで編集';
    })
    .withFailureHandler(e => {
      showAlertModal('エラー: ' + e.message);
      cell.innerHTML = `${g.fee.toLocaleString()} 円`;
      cell.onclick = function() { startGradeFeeEdit(idx, this); };
      cell.style.cursor = 'pointer';
      cell.title = 'クリックで編集';
    })
    .setGradeFee(name, g.grade, newFee);
}

  detailRequestSequence++;
  closeDetailParticipationModal();

let modalSelectedMemberId = '';

function goToPlayerSearch(name) {
  // 大会一覧の初期表示では名簿APIを呼ばず、選手照会を使う時点で取得する。
  ensureMembersLoaded(() => goToPlayerSearchWithMembers(name));
}

function goToPlayerSearchWithMembers(name) {
  const matches = allMembers.filter(member => member.name === name);
  modalSelectedMemberId = matches.length === 1 ? matches[0].id : '';
  document.getElementById('modal-player-name').textContent = name + ' の出場大会';
  document.getElementById('modal-result-name').value = name;
  document.getElementById('modal-result-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('modal-results-status').className = 'status';
  document.getElementById('modal-results-status').textContent = '';
  document.getElementById('modal-results-table').style.display = 'none';
  document.getElementById('player-modal').style.display = 'flex';
  if (matches.length > 1) {
    const status = document.getElementById('modal-results-status');
    status.textContent = '同姓同名の選手がいます。ふりがな・所属付きの候補から選択してください。';
    status.style.display = 'block';
    document.getElementById('modal-result-name').focus();
    return;
  }
  searchModalResults();
}

function closePlayerModal(event) {
  if (!event || event.target === document.getElementById('player-modal')) {
    document.getElementById('player-modal').style.display = 'none';
  }
}

function searchModalResults() {
  const name = document.getElementById('modal-result-name').value.trim();
  if (!name) {
    const s = document.getElementById('modal-results-status');
    s.className = 'status'; s.textContent = '選手名を入力してください'; s.style.display = 'block';
    return;
  }
  const sameName = allMembers.filter(member => member.name === name);
  if (!modalSelectedMemberId && sameName.length > 1) {
    const s = document.getElementById('modal-results-status');
    s.className = 'status';
    s.textContent = '同姓同名の選手がいます。候補から一人を選択してください。';
    s.style.display = 'block';
    return;
  }
  const date = document.getElementById('modal-result-date').value;
  const s = document.getElementById('modal-results-status');
  s.className = 'status'; s.innerHTML = '<span class="spinner"></span> 読み込み中...'; s.style.display = 'block';
  document.getElementById('modal-results-table').style.display = 'none';
  google.script.run
    .withSuccessHandler(onModalResultsLoaded)
    .withFailureHandler(err => {
      const s = document.getElementById('modal-results-status');
      s.className = 'status error'; s.textContent = 'エラー: ' + err.message; s.style.display = 'block';
    })
    .getTournamentResults(modalSelectedMemberId, name, date);
}

function onModalResultsLoaded(raw) {
  const s = document.getElementById('modal-results-status');
  let res;
  try {
    res = JSON.parse(raw);
  } catch (e) {
    s.className = 'status error';
    s.textContent = '出場履歴の応答を解析できませんでした。';
    s.style.display = 'block';
    return;
  }

  if (res.error) {
    s.className = 'status error'; s.textContent = 'エラー: ' + res.error; s.style.display = 'block';
    return;
  }

  const results = Array.isArray(res.results) ? res.results : [];
  if (!results.length) {
    s.className = 'status'; s.textContent = '結果がありません'; s.style.display = 'block';
    return;
  }
  const applyDateNorm = currentTournamentApplyStart
    ? currentTournamentApplyStart.split('/').join('-').substring(0, 10)
    : '';
  const tbody = document.getElementById('modal-results-tbody');
  tbody.replaceChildren();
  results.forEach(result => {
    const raffleDate = result.raffleDate || '';
    const raffleDateNorm = raffleDate.substring(0, 10);
    const tr = document.createElement('tr');
    if (applyDateNorm && raffleDateNorm > applyDateNorm) {
      tr.style.background = '#ffe0e0';
    }
    [result.date, result.location, raffleDate].forEach(value => {
      const td = document.createElement('td');
      td.textContent = value || '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  s.style.display = 'none';
  document.getElementById('modal-results-table').style.display = 'table';
}

document.getElementById('modal-result-name').addEventListener('input', event => {
  modalSelectedMemberId = '';
  const input = event.target.value.trim();
  const exactLabel = allMembers.filter(member =>
    memberSuggestionLabel(member) === input
  );
  if (exactLabel.length === 1) {
    modalSelectedMemberId = exactLabel[0].id;
    return;
  }
  const exactName = allMembers.filter(member => member.name === input);
  if (exactName.length === 1) modalSelectedMemberId = exactName[0].id;
});
</script>
