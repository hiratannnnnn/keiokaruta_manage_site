<script>
let participationMatrixData = null;
let participationMatrixSelectedNameKey = '';
let participationMatrixSelectedPlayerId = '';

function participationMatrixNormalizeName(name) {
  return String(name || '').replace(/[ 　]+/g, '').trim().toLowerCase();
}

function participationMatrixEscAttr(value) {
  return escHtml(String(value || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function participationMatrixFormatDate(value) {
  const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? match[1] + '/' + match[2] + '/' + match[3] : String(value || '');
}

function loadParticipationMatrix(force) {
  if (participationMatrixData && !force) {
    filterParticipationMatrix();
    return;
  }

  const status = document.getElementById('participation-matrix-status');
  const reload = document.getElementById('participation-matrix-reload');
  reload.disabled = true;
  status.style.display = 'block';
  status.className = 'status';
  status.innerHTML = '<span class="spinner"></span> DBから出場一覧を読み込み中...';
  document.getElementById('participation-matrix-wrap').style.display = 'none';

  google.script.run
    .withSuccessHandler(json => {
      reload.disabled = false;
      const data = JSON.parse(json);
      if (data.error) {
        status.className = 'status error';
        status.textContent = 'エラー: ' + data.error;
        return;
      }
      participationMatrixData = data;
      filterParticipationMatrix();
    })
    .withFailureHandler(error => {
      reload.disabled = false;
      status.className = 'status error';
      status.textContent = 'エラー: ' + error.message;
    })
    .getParticipationMatrix();
}

function filterParticipationMatrix() {
  if (!participationMatrixData) return;
  const playerQuery = document.getElementById('participation-matrix-player-filter')
    .value.trim().toLowerCase();
  const tournamentQuery = document.getElementById('participation-matrix-tournament-filter')
    .value.trim().toLowerCase();
  const players = participationMatrixData.players.filter(player =>
    !playerQuery || (player.name + ' ' + player.ruby).toLowerCase().includes(playerQuery)
  );
  const tournaments = participationMatrixData.tournaments.filter(tournament =>
    !tournamentQuery || [
      tournament.name,
      tournament.shortName,
      (tournament.grades || []).join('') + '級',
    ].join(' ').toLowerCase().includes(tournamentQuery)
  );
  renderParticipationMatrix(players, tournaments);
}

function renderParticipationMatrix(players, tournaments) {
  const status = document.getElementById('participation-matrix-status');
  const wrap = document.getElementById('participation-matrix-wrap');
  const badge = document.getElementById('participation-matrix-count');
  const participationMap = {};
  (participationMatrixData.participations || []).forEach(item => {
    participationMap[String(item.player_id) + ':' + String(item.tournament_id)] = item;
  });

  badge.textContent = players.length + '選手 × ' + tournaments.length + '大会';
  badge.style.display = 'inline-block';

  if (!players.length || !tournaments.length) {
    wrap.style.display = 'none';
    status.style.display = 'block';
    status.className = 'status';
    status.textContent = !players.length ? '該当する選手がいません。' : '該当する大会がありません。';
    document.getElementById('participation-matrix-selection').style.display = 'none';
    return;
  }

  document.getElementById('participation-matrix-thead').innerHTML =
    '<tr><th class="participation-player-column">選手</th>'
    + '<th class="participation-total-column" title="公認大会の出場回数">合計</th>' +
    tournaments.map(tournament =>
      '<th class="participation-tournament-column" title="'
        + participationMatrixEscAttr(tournament.name) + '">' +
        '<span>' + escHtml(tournament.shortName || tournament.name) + '</span>' +
        ((tournament.grades || []).length
          ? '<small class="participation-grades">'
            + escHtml(tournament.grades.join('') + '級') + '</small>'
          : '') +
        ((tournament.heldOn || []).length
          ? '<small>' + (tournament.heldOn || []).map(participationMatrixFormatDate)
            .map(escHtml).join('<br>') + '</small>'
          : '') +
      '</th>'
    ).join('') + '</tr>';

  document.getElementById('participation-matrix-tbody').innerHTML =
    players.map(player => {
      const nameKey = participationMatrixNormalizeName(player.name);
      return '<tr class="participation-player-row" tabindex="0" aria-selected="false"'
        + ' data-player-id="' + participationMatrixEscAttr(player.id) + '"'
        + ' data-name-key="' + participationMatrixEscAttr(nameKey) + '">'
        + '<th class="participation-player-column" title="'
        + participationMatrixEscAttr(player.ruby || '') + '">' +
        escHtml(player.name) +
      '</th>'
      + '<td class="participation-total-column" title="公認'
        + Number(player.sanctionedCount || 0) + '／非公認'
        + Number(player.unsanctionedCount || 0) + '／混在'
        + Number(player.mixedCount || 0) + '／全大会'
        + Number(player.allTournamentCount || 0) + '">'
        + Number(player.totalCount || 0) + '</td>' +
      tournaments.map(tournament => {
        const item = participationMap[String(player.id) + ':' + String(tournament.id)];
        const mark = item ? item.mark : '';
        const symbol = mark === 'sanctioned' ? '○'
          : (mark === 'unsanctioned' ? '△' : (mark === 'mixed' ? '○△' : ''));
        const title = mark === 'sanctioned' ? '公認大会'
          : (mark === 'unsanctioned' ? '非公認大会'
            : (mark === 'mixed' ? '公認・非公認の両方' : ''));
        return '<td class="' + (mark ? 'participation-' + mark : '') + '"'
          + (title ? ' title="' + title + '"' : '') + '>' +
          symbol +
        '</td>';
      }).join('') + '</tr>';
    }).join('');

  document.querySelectorAll('.participation-player-row').forEach(row => {
    row.addEventListener('click', () => {
      participationMatrixToggleSelection(row.dataset.nameKey, row.dataset.playerId);
    });
    row.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      participationMatrixToggleSelection(row.dataset.nameKey, row.dataset.playerId);
    });
  });
  participationMatrixApplySelection();

  status.style.display = participationMatrixData.truncated ? 'block' : 'none';
  if (participationMatrixData.truncated) {
    status.className = 'status error';
    status.textContent =
      'APIが結果を切り詰めたため、一部のデータや合計回数が正確でない可能性があります。';
  }
  wrap.style.display = 'block';
}

function participationMatrixToggleSelection(nameKey, playerId) {
  const deselect = participationMatrixSelectedPlayerId === String(playerId);
  participationMatrixSelectedNameKey = deselect ? '' : nameKey;
  participationMatrixSelectedPlayerId = deselect ? '' : String(playerId);
  participationMatrixApplySelection();
}

function participationMatrixApplySelection() {
  const rows = Array.from(document.querySelectorAll('.participation-player-row'));
  let selectedCount = 0;
  rows.forEach(row => {
    const selected = participationMatrixSelectedNameKey
      && row.dataset.nameKey === participationMatrixSelectedNameKey;
    row.classList.toggle('participation-row-selected', Boolean(selected));
    row.setAttribute('aria-selected', selected ? 'true' : 'false');
    if (selected) selectedCount++;
  });
  const notice = document.getElementById('participation-matrix-selection');
  const memoPanel = document.getElementById('participation-matrix-memo-panel');
  if (!participationMatrixSelectedNameKey || !selectedCount) {
    notice.style.display = 'none';
    notice.textContent = '';
    memoPanel.style.display = 'none';
    return;
  }
  notice.style.display = '';
  notice.textContent = selectedCount > 1
    ? '同姓同名の候補を' + selectedCount + '件ハイライトしています。同一人物とは限りません。'
    : '選択した選手をハイライトしています。';
  participationMatrixShowMemo();
}

function participationMatrixShowMemo() {
  const playerId = participationMatrixSelectedPlayerId;
  const player = (participationMatrixData.players || []).find(
    item => String(item.id) === playerId
  );
  const panel = document.getElementById('participation-matrix-memo-panel');
  if (!player) {
    panel.style.display = 'none';
    return;
  }
  document.getElementById('participation-matrix-memo-player').textContent =
    player.name + '（選手ID: ' + player.id + '）';
  const textarea = document.getElementById('participation-matrix-memo');
  textarea.value = String(
    (participationMatrixData.playerNotes || {})[playerId] || ''
  );
  document.getElementById('participation-matrix-memo-status').textContent = '';
  document.getElementById('participation-matrix-memo-save').disabled = false;
  participationMatrixMemoChanged();
  panel.style.display = '';
}

function participationMatrixMemoChanged() {
  const textarea = document.getElementById('participation-matrix-memo');
  document.getElementById('participation-matrix-memo-count').textContent =
    textarea.value.length + ' / 1000';
}

function saveParticipationMatrixMemo() {
  const playerId = participationMatrixSelectedPlayerId;
  if (!playerId) return;
  const textarea = document.getElementById('participation-matrix-memo');
  const button = document.getElementById('participation-matrix-memo-save');
  const status = document.getElementById('participation-matrix-memo-status');
  const memo = textarea.value.trim();
  button.disabled = true;
  status.textContent = '保存中...';
  status.className = 'op-status';
  google.script.run
    .withSuccessHandler(json => {
      const result = JSON.parse(json);
      button.disabled = false;
      if (result.error) {
        status.textContent = 'エラー: ' + result.error;
        status.className = 'op-status error';
        return;
      }
      if (!participationMatrixData.playerNotes) {
        participationMatrixData.playerNotes = {};
      }
      if (result.memo) {
        participationMatrixData.playerNotes[playerId] = result.memo;
      } else {
        delete participationMatrixData.playerNotes[playerId];
      }
      textarea.value = result.memo || '';
      participationMatrixMemoChanged();
      status.textContent = result.memo ? '保存しました。' : 'メモを削除しました。';
      status.className = 'op-status ok';
    })
    .withFailureHandler(error => {
      button.disabled = false;
      status.textContent = 'エラー: ' + error.message;
      status.className = 'op-status error';
    })
    .saveParticipationPlayerNote(playerId, memo);
}
</script>
