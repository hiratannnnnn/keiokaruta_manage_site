<script>
// ------------------------------------------------------------
// ヘルプ（掲示板スプレッドシートの「ヘルプ」シートから取得）
// ------------------------------------------------------------
let _helpContent = null; // キャッシュ

function showHelpForCurrentPage() {
  const activeBtn = document.querySelector('nav button.active');
  const page = activeBtn ? activeBtn.dataset.page : 'calendar';

  if (_helpContent) {
    _renderHelpModal(page, _helpContent);
    document.getElementById('help-modal').style.display = 'flex';
    return;
  }

  // 未ロードならサーバーから取得
  document.getElementById('help-modal-title').textContent = 'ヘルプ';
  const loading = document.getElementById('help-modal-body');
  loading.replaceChildren();
  const loadingStatus = document.createElement('div');
  loadingStatus.className = 'status';
  loadingStatus.textContent = '読み込み中...';
  loading.appendChild(loadingStatus);
  document.getElementById('help-modal').style.display = 'flex';

  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      if (r.error) {
        _renderHelpError(r.error);
        return;
      }
      _helpContent = r.content;
      _renderHelpModal(page, _helpContent);
    })
    .withFailureHandler(e => {
      _renderHelpError(e.message);
    })
    .getHelpContent();
}

function _renderHelpModal(page, content) {
  const c = content[page];
  document.getElementById('help-modal-title').textContent =
    (c ? c.title : page) + '　ヘルプ';

  const body = document.getElementById('help-modal-body');
  body.replaceChildren();
  if (!c || !c.sections.length) {
    const empty = document.createElement('p');
    empty.className = 'help-empty';
    empty.textContent = 'このページのヘルプはまだ準備されていません。';
    body.appendChild(empty);
  } else {
    c.sections.forEach(section => {
      const wrap = document.createElement('div');
      wrap.className = 'help-section';
      if (section.heading) {
        const heading = document.createElement('div');
        heading.className = 'help-heading';
        heading.textContent = section.heading;
        wrap.appendChild(heading);
      }
      const list = document.createElement('ul');
      list.className = 'help-list';
      section.items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        list.appendChild(li);
      });
      wrap.appendChild(list);
      body.appendChild(wrap);
    });
  }
}

function _renderHelpError(message) {
  const body = document.getElementById('help-modal-body');
  body.replaceChildren();
  const error = document.createElement('p');
  error.className = 'help-error';
  error.textContent = 'エラー: ' + String(message || '');
  body.appendChild(error);
}

function closeHelpModal() {
  document.getElementById('help-modal').style.display = 'none';
}

function onHelpOverlayClick(e) {
  if (e.target === document.getElementById('help-modal')) closeHelpModal();
}

function showHelpBtn() {
  document.getElementById('help-btn').style.display = 'inline-flex';
}
</script>
