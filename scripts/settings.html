<script>
// ------------------------------------------------------------
// 設定ページ
// ------------------------------------------------------------
let settingsPageLoaded = false;
const SHEET_MIGRATION_NAV_KEY = 'karuta_show_sheet_migration';
const AUTHENTICATION_NAV_KEY = 'karuta_show_authentication';

function isSheetMigrationNavigationEnabled() {
  try {
    return sessionStorage.getItem(SHEET_MIGRATION_NAV_KEY) === 'true';
  } catch (e) {
    return false;
  }
}

function applySheetMigrationNavigationVisibility() {
  const visible = isSheetMigrationNavigationEnabled();
  document.getElementById('nav-sheet-migration-btn').style.display =
    visible ? 'inline-block' : 'none';
}

function toggleSheetMigrationNavigation(enabled) {
  try {
    if (enabled) {
      sessionStorage.setItem(SHEET_MIGRATION_NAV_KEY, 'true');
    } else {
      sessionStorage.removeItem(SHEET_MIGRATION_NAV_KEY);
    }
  } catch (e) {}
  applySheetMigrationNavigationVisibility();
}

function consumeSheetMigrationNavigationActivation() {
  try { sessionStorage.removeItem(SHEET_MIGRATION_NAV_KEY); } catch (e) {}
  const checkbox = document.getElementById('settings-show-sheet-migration');
  if (checkbox) checkbox.checked = false;
  applySheetMigrationNavigationVisibility();
}

function isAuthenticationNavigationEnabled() {
  try {
    return sessionStorage.getItem(AUTHENTICATION_NAV_KEY) === 'true';
  } catch (e) {
    return false;
  }
}

function applyAuthenticationNavigationVisibility() {
  const visible = isAuthenticationNavigationEnabled();
  document.getElementById('nav-authentication-btn').style.display =
    visible ? 'inline-block' : 'none';
}

function toggleAuthenticationNavigation(enabled) {
  try {
    if (enabled) {
      sessionStorage.setItem(AUTHENTICATION_NAV_KEY, 'true');
    } else {
      sessionStorage.removeItem(AUTHENTICATION_NAV_KEY);
    }
  } catch (e) {}
  applyAuthenticationNavigationVisibility();
}

function consumeAuthenticationNavigationActivation() {
  try { sessionStorage.removeItem(AUTHENTICATION_NAV_KEY); } catch (e) {}
  const checkbox = document.getElementById('settings-show-authentication');
  if (checkbox) checkbox.checked = false;
  applyAuthenticationNavigationVisibility();
}

function initSettingsPage() {
  document.getElementById('settings-show-sheet-migration').checked =
    isSheetMigrationNavigationEnabled();
  document.getElementById('settings-show-authentication').checked =
    isAuthenticationNavigationEnabled();
  if (settingsPageLoaded) return;
  settingsPageLoaded = true;
  loadEnvironmentConfigStatus();
  loadRoleNamesSettings();
}

function reloadSettingsPage() {
  settingsPageLoaded = false;
  initSettingsPage();
}

function loadEnvironmentConfigStatus() {
  const status = document.getElementById('environment-status');
  const details = document.getElementById('environment-details');
  status.style.display = 'block';
  details.style.display = 'none';
  google.script.run
    .withSuccessHandler(json => {
      let data;
      try {
        data = JSON.parse(json);
      } catch (e) {
        status.className = 'status error';
        status.textContent = '環境設定の応答を解析できませんでした。';
        return;
      }
      if (data.error) {
        status.className = 'status error';
        status.textContent = 'エラー: ' + data.error;
        return;
      }
      const list = document.getElementById('environment-property-list');
      list.replaceChildren();
      data.items.forEach(item => {
        const li = document.createElement('li');
        li.className = item.configured ? 'configured' : 'fallback';
        li.textContent = item.key + '：'
          + (item.configured ? 'Script Properties登録済み'
            : '未設定');
        list.appendChild(li);
      });
      const warnings = document.getElementById('environment-warnings');
      warnings.replaceChildren();
      (data.warnings || []).forEach(message => {
        const p = document.createElement('p');
        p.textContent = '警告：' + message;
        warnings.appendChild(p);
      });
      status.style.display = 'none';
      details.style.display = '';
    })
    .withFailureHandler(error => {
      status.className = 'status error';
      status.textContent = 'エラー: ' + error.message;
    })
    .getEnvironmentConfigurationStatus();
}

// ------------------------------------------------------------
// 役職者苗字
// ------------------------------------------------------------
const ROLE_NAMES_KEYS = ['会長', '副会長', '申込係', '振込係', '案内係'];

function loadRoleNamesSettings() {
  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      ROLE_NAMES_KEYS.forEach(key => {
        const el = document.getElementById('rn-' + key);
        if (el) el.value = r[key] || '';
      });
    })
    .getRoleNames();
}

function saveRoleNamesSettings() {
  const names = {};
  ROLE_NAMES_KEYS.forEach(key => {
    names[key] = document.getElementById('rn-' + key)?.value?.trim() || '';
  });
  const statusEl = document.getElementById('rn-status');
  statusEl.textContent = '保存中...';
  statusEl.style.color = '#666';
  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      if (r.error) {
        statusEl.textContent = 'エラー: ' + r.error;
        statusEl.style.color = '#e74c3c';
      } else {
        statusEl.textContent = '保存しました';
        statusEl.style.color = '#27ae60';
      }
    })
    .withFailureHandler(e => {
      statusEl.textContent = 'エラー: ' + e.message;
      statusEl.style.color = '#e74c3c';
    })
    .saveRoleNames(JSON.stringify(names));
}

</script>
