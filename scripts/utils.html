<script>
// ------------------------------------------------------------
// ユーティリティ
// ------------------------------------------------------------
function setStatus(key, type, msg) {
  const statusEl = document.getElementById(key + '-status');
  const tableEl  = document.getElementById(key + '-table');
  if (tableEl) tableEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.className = 'status' + (type === 'error' ? ' error' : '');
  statusEl.replaceChildren();
  if (type === 'loading') {
    const spinner = document.createElement('span');
    spinner.className = 'spinner';
    statusEl.appendChild(spinner);
    statusEl.appendChild(document.createTextNode(' 読み込み中...'));
    return;
  }
  statusEl.textContent = type === 'error'
    ? 'エラー: ' + String(msg || '')
    : String(msg || 'データがありません');
}

function escHtml(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(s) {
  return escHtml(s);
}

function isSafeHttpUrl(value) {
  const text = String(value || '').trim();
  if (!/^https?:\/\//i.test(text)) return false;
  try {
    const url = new URL(text);
    return url.protocol === 'https:' || url.protocol === 'http:';
  } catch (e) {
    return false;
  }
}

function setSanitizedRichText(target, html) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');
  const allowed = new Set([
    'P', 'BR', 'DIV', 'SPAN', 'STRONG', 'B', 'EM', 'I', 'U',
    'UL', 'OL', 'LI', 'H1', 'H2', 'H3', 'H4', 'A',
  ]);
  Array.from(template.content.querySelectorAll('*')).forEach(element => {
    if (!allowed.has(element.tagName)) {
      element.replaceWith(document.createTextNode(element.textContent || ''));
      return;
    }
    const href = element.tagName === 'A' ? element.getAttribute('href') : '';
    Array.from(element.attributes).forEach(attribute =>
      element.removeAttribute(attribute.name)
    );
    if (element.tagName === 'A' && isSafeHttpUrl(href)) {
      element.href = href;
      element.target = '_blank';
      element.rel = 'noopener noreferrer';
    }
  });
  target.replaceChildren(template.content.cloneNode(true));
}

// ------------------------------------------------------------
// 完了モーダル（フォーム作成・下書き作成など）
// ------------------------------------------------------------
let _completionButtons = [];

function showCompletionModal(title, bodyHtml, buttons) {
  _completionButtons = buttons;
  document.getElementById('completion-modal-title').textContent = title;
  document.getElementById('completion-modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('completion-modal-footer');
  footer.innerHTML = buttons.map((b, i) =>
    `<button class="modal-footer-btn${b.primary ? ' primary' : ''}" onclick="_completionBtnClick(${i})">${escHtml(b.label)}</button>`
  ).join('');
  document.getElementById('completion-modal').style.display = 'flex';
}

function _completionBtnClick(i) {
  closeCompletionModal();
  const btn = _completionButtons[i];
  if (btn && btn.action) btn.action();
}

function closeCompletionModal() {
  document.getElementById('completion-modal').style.display = 'none';
}

function onCompletionOverlayClick(e) {
  if (e.target === document.getElementById('completion-modal')) closeCompletionModal();
}

// ------------------------------------------------------------
// 権限管理
// ------------------------------------------------------------
let currentPermissions = {
  applyDoneInput:          ['申込係', '会長副会長'],
  payDoneInput:            ['振込係', '会長副会長'],
  completeTournament:      ['会長副会長'],
  payDetailButtons:        ['振込係', '会長副会長'],
  operationPanel:          ['申込係', '振込係', '案内係', '会長副会長'],
  announcementDoubleCheck: ['案内係', '会長副会長'],
};
let permissionsLoaded = false;
let permissionsLoading = false;
let permissionLoadCallbacks = [];

function hasPermission(key) {
  const allowed = currentPermissions[key];
  if (!allowed) return true; // 未定義キーはデフォルト許可
  return allowed.includes(currentRole);
}

function loadAndApplyPermissions(callback) {
  if (permissionsLoaded) {
    if (callback) callback();
    return;
  }
  if (callback) permissionLoadCallbacks.push(callback);
  if (permissionsLoading) return;
  permissionsLoading = true;

  const finish = () => {
    permissionsLoading = false;
    permissionsLoaded = true;
    const callbacks = permissionLoadCallbacks.splice(0);
    callbacks.forEach(item => {
      try { item(); } catch (e) {}
    });
  };
  google.script.run
    .withSuccessHandler(json => {
      try { currentPermissions = JSON.parse(json); } catch(e) {}
      finish();
    })
    .withFailureHandler(finish)
    .getPermissions();
}

// ------------------------------------------------------------
// タブ切替
// ------------------------------------------------------------
let calendarLoaded    = false;
let calendarLoading   = false;
let makeEmailLoaded   = false;
let participationMatrixLoaded = false;

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const page = btn.dataset.page;
    document.getElementById('page-' + page).classList.add('active');
    if (page === 'calendar' && !calendarLoaded) loadCalendar();
    if (page === 'player') ensureMembersLoaded();
    if (page === 'participation-matrix' && !participationMatrixLoaded) {
      loadParticipationMatrix();
      participationMatrixLoaded = true;
    }
    if (page === 'board') initBoard();
    if (page === 'make-email' && !makeEmailLoaded) { initMakeEmail(null); makeEmailLoaded = true; }
    if (page === 'mail-management') initMailManagement();
    if (page === 'suitou') initSuitou();
    if (page === 'database-admin') initDatabaseAdmin();
    if (page === 'sheet-migration') {
      initSheetMigration();
      // 表示許可は一度タブを開いた時点で消費し、ナビゲーションを再び隠す。
      consumeSheetMigrationNavigationActivation();
    }
    if (page === 'settings') initSettingsPage();
  });
});

// ------------------------------------------------------------
// 初期化（ログイン後に呼び出す）
// ------------------------------------------------------------
function initApp() {
  const roleClassMap = {
    '案内係':    'role-announcer',
    '申込係':    'role-apply',
    '振込係':    'role-payment',
    '会長副会長': 'role-president',
  };
  document.body.classList.remove('role-announcer', 'role-apply', 'role-payment', 'role-president');
  const roleClass = roleClassMap[currentRole];
  if (roleClass) document.body.classList.add(roleClass);

  loadAndApplyPermissions(() => {
    if (calendarLoaded) renderCalendar(allTournaments);
  });
  // 初期表示では外部APIを呼ばず、カレンダーシートの大会一覧を優先する。
  if (calendarLoaded) {
    renderCalendar(allTournaments);
  } else {
    loadCalendar();
  }
  document.getElementById('result-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('nav-settings-btn').style.display =
    currentRole === '会長副会長' ? 'inline-block' : 'none';
  document.getElementById('nav-database-admin-btn').style.display =
    currentRole === '会長副会長' ? 'inline-block' : 'none';
  applySheetMigrationNavigationVisibility();
  const isAnnouncer = currentRole === '案内係' || currentRole === '会長副会長';
  document.getElementById('nav-form-create-btn').style.display = isAnnouncer ? 'inline-block' : 'none';
  document.getElementById('nav-make-email-btn').style.display       = isAnnouncer ? 'inline-block' : 'none';
  document.getElementById('nav-mail-management-btn').style.display  = isAnnouncer ? 'inline-block' : 'none';
  const canSeeSuitou = currentRole === '会長副会長' || currentRole === '振込係';
  document.getElementById('nav-suitou-btn').style.display = canSeeSuitou ? 'inline-block' : 'none';
}

window.addEventListener('load', () => {
  document.getElementById('result-date').value = new Date().toISOString().slice(0, 10);
  // 前回の役職が有効なら選択画面を省略する。アクセス認証はGoogle側で実施される。
  restorePreviousRoleAndStart();
});
</script>
