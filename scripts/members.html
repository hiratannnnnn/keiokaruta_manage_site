<script>
// ------------------------------------------------------------
// 名簿
// ------------------------------------------------------------
let allMembers = [];
let selectedMemberId = '';
let membersLoaded = false;
let membersLoading = false;
let memberLoadCallbacks = [];

function ensureMembersLoaded(callback) {
  if (membersLoaded) {
    if (callback) callback();
    return;
  }
  if (callback) memberLoadCallbacks.push(callback);
  if (!membersLoading) loadMembers(false);
}

function finishMemberLoadCallbacks() {
  const callbacks = memberLoadCallbacks.splice(0);
  callbacks.forEach(callback => {
    try { callback(); } catch (e) {}
  });
}

function loadMembers(force) {
  if (membersLoading) return;
  if (membersLoaded && !force) {
    renderMemberSuggestions();
    renderMembers(allMembers);
    return;
  }
  membersLoading = true;
  membersLoaded = false;
  allMembers = [];
  renderMemberSuggestions();
  document.getElementById('member-count').style.display = 'none';
  setStatus('members', 'loading');
  google.script.run
    .withSuccessHandler(onMembersLoaded)
    .withFailureHandler(err => {
      membersLoading = false;
      setStatus('members', 'error', err.message);
      finishMemberLoadCallbacks();
    })
    .getMembers();
}

function onMembersLoaded(json) {
  let data;
  try {
    data = JSON.parse(json);
  } catch (e) {
    membersLoading = false;
    setStatus('members', 'error', '名簿の応答を解析できませんでした。');
    finishMemberLoadCallbacks();
    return;
  }
  if (data.error) {
    membersLoading = false;
    setStatus('members', 'error', data.error);
    finishMemberLoadCallbacks();
    return;
  }
  if (!data.length) {
    membersLoading = false;
    membersLoaded = true;
    setStatus('members', 'empty', 'データがありません');
    finishMemberLoadCallbacks();
    return;
  }
  allMembers = data.sort((a, b) =>
    String(a.name).localeCompare(String(b.name), 'ja')
  );
  membersLoading = false;
  membersLoaded = true;
  renderMemberSuggestions();
  renderMembers(allMembers);
  finishMemberLoadCallbacks();
}

function memberSuggestionLabel(member) {
  const details = [member.ruby, member.club].filter(Boolean).join(' / ');
  return details ? member.name + '（' + details + '）' : member.name;
}

function renderMemberSuggestions() {
  ['result-name-suggestions', 'modal-result-name-suggestions'].forEach(id => {
    const datalist = document.getElementById(id);
    if (!datalist) return;
    datalist.replaceChildren();
    allMembers.forEach(member => {
      const option = document.createElement('option');
      option.value = memberSuggestionLabel(member);
      datalist.appendChild(option);
    });
  });
}

function renderMembers(members) {
  if (!members.length) { setStatus('members', 'empty', 'データがありません'); return; }

  const thead = document.getElementById('members-thead');
  const tbody = document.getElementById('members-tbody');
  thead.replaceChildren();
  tbody.replaceChildren();

  const headerRow = document.createElement('tr');
  ['氏名', 'ふりがな', '所属'].forEach(label => {
    const th = document.createElement('th');
    th.textContent = label;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);

  members.forEach(member => {
    const tr = document.createElement('tr');
    [member.name, member.ruby, member.club].forEach((value, index) => {
      const td = document.createElement('td');
      td.textContent = value || '';
      if (index === 0) {
        td.className = 'name-link';
        td.addEventListener('click', () => selectMember(member.id, member.name));
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById('members-status').style.display = 'none';
  document.getElementById('members-table').style.display = 'table';
  const badge = document.getElementById('member-count');
  badge.textContent = members.length + ' 件';
  badge.style.display = 'inline-block';
}

function filterMembers() {
  const q = document.getElementById('member-search').value.trim().toLowerCase();
  renderMembers(q ? allMembers.filter(m =>
    [m.name, m.ruby, m.club].some(v => String(v).toLowerCase().includes(q))
  ) : allMembers);
}

function selectMember(playerId, name) {
  selectedMemberId = String(playerId);
  document.getElementById('result-name').value = name;
  searchResults();
}
</script>
