<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP',
      'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, sans-serif;
    background: #f5f5f5;
    color: #263238;
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========== ログイン画面 ========== */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .login-box {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 6px 32px rgba(0,0,0,0.25);
    padding: 32px 36px;
    width: 360px;
    max-width: 95vw;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #2c3e50;
    text-align: center;
    margin-bottom: 4px;
  }
  .login-description {
    margin-bottom: 14px;
    color: #667085;
    font-size: 0.9rem;
  }
  .login-role-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .login-role-btn {
    padding: 7px 14px;
    border: 2px solid #bdc3c7;
    border-radius: 20px;
    background: #fff;
    color: #555;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .login-role-btn:hover { border-color: #3498db; color: #3498db; }
  .login-role-btn.active { border-color: #3498db; background: #3498db; color: #fff; }
  .login-pw-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-pw-input:focus { border-color: #3498db; }
  .login-submit-btn {
    padding: 10px;
    background: #2c3e50;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-submit-btn:hover { background: #3d5166; }
  .login-error {
    color: #e74c3c;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }
  .login-cancel-btn {
    padding: 8px;
    background: #fff;
    color: #666;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-cancel-btn:hover { background: #f0f0f0; }
  .login-logout-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 0.78rem;
    text-align: center;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .login-logout-btn:hover { color: #e74c3c; }

  /* ヘッダー＋ナビ固定 */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header {
    background: #2c3e50;
    color: #fff;
    padding: 14px 24px;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  .current-role-badge {
    background: #3498db;
    color: #fff;
    font-size: 0.8rem;
    padding: 3px 12px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .current-role-badge:hover { background: #2980b9; }

  /* タブナビ */
  nav {
    background: #34495e;
    display: flex;
  }
  nav button {
    background: none;
    border: none;
    color: #bdc3c7;
    padding: 12px 24px;
    font-size: 0.95rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  nav button:hover { color: #fff; }
  nav button.active { color: #fff; border-bottom-color: #3498db; }

  /* ========== ロールカラー ========== */
  body.role-announcer,
  body.role-apply,
  body.role-payment,
  body.role-president { --role-color: #3498db; --role-color-dark: #2c3e50; }

  body[class*="role-"] nav button.active       { border-bottom-color: var(--role-color); }

  .db-admin-panel { max-width: 980px; margin-bottom: 16px; }
  .db-admin-warning {
    margin: 0 0 14px;
    padding: 10px 12px;
    color: #8a4b08;
    background: #fff4df;
    border: 1px solid #f2cf91;
    border-radius: 6px;
    line-height: 1.55;
  }
  .db-admin-sync-description { margin: 0; line-height: 1.6; }
  .db-admin-sync-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
  .db-admin-sync-actions button {
    padding: 8px 15px;
    border: 0;
    border-radius: 5px;
    background: #315b7d;
    color: #fff;
    cursor: pointer;
  }
  .db-admin-sync-actions button.db-admin-delete-button { background: #c0392b; }
  .db-admin-sync-actions button:disabled { cursor: default; opacity: 0.45; }
  #db-admin-sync-preview {
    max-height: 440px;
    overflow: auto;
    margin: 0;
    padding: 10px;
    border-radius: 5px;
    background: #15202b;
    color: #dbeafe;
    font: 12px/1.5 monospace;
    white-space: pre-wrap;
  }
  .db-admin-sync-progress { display: flex; align-items: center; gap: 10px; }
  .db-admin-sync-progress-track {
    width: min(360px, 45%);
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #dfe7ed;
  }
  .db-admin-sync-progress-bar {
    width: 0;
    height: 100%;
    background: #315b7d;
    transition: width 0.2s ease;
  }
  .db-admin-sync-progress-text { color: #536474; font-size: 0.84rem; }
  .db-admin-sync-errors {
    max-height: 260px;
    overflow: auto;
    margin: 0;
    padding: 10px 10px 10px 30px;
    border: 1px solid #e6a5a0;
    border-radius: 5px;
    background: #fff0ef;
    color: #9f2f26;
    line-height: 1.55;
    font-size: 0.87rem;
  }
  .db-admin-presets { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .db-admin-presets button, .db-admin-result-header button {
    padding: 6px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }
  .db-admin-request-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; }
  .db-admin-request-row .login-submit-btn { width: auto; margin: 0; padding: 8px 22px; }
  .db-admin-request-row .db-admin-danger { background: #c0392b; }
  .db-admin-editors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .db-admin-editors label { display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; }
  .db-admin-editors textarea {
    min-height: 130px;
    padding: 9px;
    border: 1px solid #ccd4dc;
    border-radius: 5px;
    font: 13px/1.5 monospace;
    resize: vertical;
  }
  .db-admin-result-header { display: flex; align-items: center; justify-content: space-between; }
  .db-admin-split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .db-admin-pane { min-width: 0; }
  .db-admin-pane-controls {
    display: grid;
    grid-template-columns: minmax(120px, 0.8fr) minmax(150px, 1.2fr) auto;
    gap: 7px;
    align-items: end;
  }
  .db-admin-pane-controls label {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 5px;
    font-size: 0.85rem;
  }
  .db-admin-pane-controls button, .db-admin-pagination button {
    padding: 7px 11px;
    border: 1px solid #c4ced8;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }
  .db-admin-pane-controls button:disabled, .db-admin-pagination button:disabled {
    cursor: default;
    opacity: 0.45;
  }
  .db-admin-pane-table-wrap {
    min-height: 330px;
    max-height: 560px;
    margin-top: 7px;
    overflow: auto;
    border: 1px solid #e0e5ea;
    border-radius: 5px;
  }
  .db-admin-pane-table-wrap table { min-width: max-content; }
  .db-admin-pane-table-wrap th { position: sticky; top: 0; z-index: 1; }
  .db-admin-pane-table-wrap td { max-width: 280px; overflow-wrap: anywhere; }
  .db-admin-pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    margin-top: 9px;
    font-size: 0.8rem;
  }
  .db-admin-searching::before {
    content: "";
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border: 2px solid #b8c4ce;
    border-top-color: #315b7d;
    border-radius: 50%;
    vertical-align: -1px;
    animation: spin 0.75s linear infinite;
  }
  .db-admin-table-toolbar {
    display: grid;
    grid-template-columns: minmax(230px, 1fr) minmax(240px, 1fr) auto;
    align-items: end;
    gap: 10px;
  }
  .db-admin-table-toolbar label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.85rem;
  }
  .db-admin-table-toolbar button, .db-admin-edit-actions button {
    min-height: 37px;
    padding: 7px 16px;
    border: 0;
    border-radius: 5px;
    background: #315b7d;
    color: #fff;
    cursor: pointer;
  }
  .db-admin-table-wrap { max-height: 560px; margin-top: 8px; overflow: auto; }
  .db-admin-table-wrap table { min-width: max-content; }
  .db-admin-table-wrap th { position: sticky; top: 0; z-index: 1; }
  .db-admin-table-wrap td { max-width: 360px; overflow-wrap: anywhere; }
  .db-admin-editable-row { cursor: pointer; }
  .db-admin-editable-row:hover td { background: #edf6ff; }
  .db-admin-table-note { margin: 8px 0 0; color: #667; font-size: 0.82rem; }
  .db-admin-json-editor {
    width: 100%;
    min-height: 210px;
    padding: 10px;
    border: 1px solid #ccd4dc;
    border-radius: 5px;
    font: 13px/1.55 monospace;
    resize: vertical;
  }
  .db-admin-edit-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .db-admin-edit-actions .db-admin-delete-button { background: #c0392b; }
  .db-admin-advanced > summary { cursor: pointer; list-style-position: inside; }
  .db-admin-help { margin-top: 14px; font-size: 0.86rem; }
  .db-admin-help summary { cursor: pointer; color: #315b7d; }
  .db-admin-help > div { margin-top: 9px; }
  .db-admin-help code { display: inline-block; margin-top: 7px; font-weight: 600; }
  .db-admin-help pre {
    margin: 4px 0;
    padding: 7px 9px;
    border-radius: 4px;
    background: #f3f6f8;
    white-space: pre-wrap;
  }
  #db-admin-response {
    min-height: 220px;
    max-height: 560px;
    overflow: auto;
    margin: 0;
    padding: 12px;
    border-radius: 6px;
    background: #15202b;
    color: #dbeafe;
    font: 13px/1.55 monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  @media (max-width: 720px) {
    .db-admin-split { grid-template-columns: 1fr; }
    .db-admin-pane-controls { grid-template-columns: 1fr; }
    .db-admin-table-toolbar { grid-template-columns: 1fr; }
    .db-admin-request-row { grid-template-columns: 90px 1fr; }
    .db-admin-request-row button { grid-column: 1 / -1; }
    .db-admin-editors { grid-template-columns: 1fr; }
  }
  body[class*="role-"] .panel-header           { background: var(--role-color-dark); }
  body[class*="role-"] .list-page .page-title,
  body[class*="role-"] .list-page .page-title-row { border-bottom-color: var(--role-color); }
  body[class*="role-"] .me-type-btn:hover      { border-color: var(--role-color); background: color-mix(in srgb, var(--role-color) 10%, #fff); color: var(--role-color-dark); }
  body[class*="role-"] .me-back-btn:focus,
  body[class*="role-"] .me-copy-btn:focus      { outline-color: var(--role-color); }

  /* ページ切替 */
  .page { display: none; flex: 1; }
  .page.active { display: flex; flex-direction: column; }

  /* ===== 選手大会照会：2カラム ===== */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    flex: 1;
  }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  /* パネル */
  .panel {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: #2c3e50;
    color: #fff;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .panel-body {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    overflow: hidden;
  }

  /* ===== 大会一覧 ===== */
  .list-page {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .list-page .page-title {
    font-size: 1rem;
    font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 2px solid #3498db;
  }
  .page-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #3498db;
  }
  .list-page .page-title-row .page-title {
    padding-bottom: 0;
    border-bottom: 0;
  }
  .page-guide-btn,
  .page-guide-back-btn {
    padding: 7px 13px;
    border: 1px solid #9eb4c5;
    border-radius: 5px;
    background: #f4f8fb;
    color: #34495e;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .page-guide-btn:hover,
  .page-guide-back-btn:hover {
    border-color: #6889a3;
    background: #e8f1f7;
  }
  .page-title-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header-action {
    margin-left: auto;
    padding: 5px 10px;
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 4px;
    background: rgba(255,255,255,0.16);
    color: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }
  .panel-header-action:hover { background: rgba(255,255,255,0.3); }
  .panel-header-action:disabled,
  .page-guide-back-btn:disabled {
    cursor: default;
    opacity: 0.5;
  }

  /* 検索バー */
  .search-bar {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .search-bar input[type="text"],
  .search-bar input[type="date"] {
    padding: 7px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.88rem;
  }
  .search-bar input[type="text"] { flex: 1; }
  .search-bar input[type="date"] { flex: 0 0 auto; }
  .search-bar button {
    padding: 7px 14px;
    background: #3498db;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .search-bar button:hover { background: #2980b9; }

  /* 選手 × 大会 出場一覧 */
  .participation-matrix-panel .panel-body {
    min-height: 0;
  }
  .participation-matrix-controls {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .participation-matrix-controls input {
    flex: 1 1 220px;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.88rem;
  }
  .participation-matrix-controls button {
    padding: 7px 14px;
    border: none;
    border-radius: 4px;
    background: #3498db;
    color: #fff;
    cursor: pointer;
  }
  .participation-matrix-controls button:disabled {
    background: #95a5a6;
    cursor: default;
  }
  .participation-matrix-note {
    margin: 4px 0 9px;
    color: #777;
    font-size: 0.78rem;
  }
  .participation-matrix-wrap {
    max-height: calc(100vh - 265px);
    overflow: auto;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  .participation-matrix-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .participation-matrix-table th,
  .participation-matrix-table td {
    border-right: 1px solid #e5e5e5;
    border-bottom: 1px solid #e5e5e5;
    text-align: center;
  }
  .participation-matrix-table thead th {
    top: 0;
    z-index: 3;
    min-width: 88px;
    max-width: 140px;
    white-space: normal;
    line-height: 1.35;
  }
  .participation-tournament-column small {
    display: block;
    margin-top: 3px;
    color: #dbe6ed;
    font-size: 0.68rem;
    font-weight: 400;
  }
  .participation-tournament-column .participation-grades {
    color: #fff;
    font-weight: 700;
  }
  .participation-matrix-table .participation-player-column {
    position: sticky;
    left: 0;
    z-index: 2;
    width: 170px;
    min-width: 170px;
    max-width: 170px;
    text-align: left;
    white-space: nowrap;
  }
  .participation-matrix-table .participation-total-column {
    position: sticky;
    left: 170px;
    z-index: 2;
    width: 62px;
    min-width: 62px;
    max-width: 62px;
    background: #fff;
    font-weight: 700;
  }
  .participation-matrix-table thead .participation-player-column {
    z-index: 4;
    background: #34495e;
  }
  .participation-matrix-table thead .participation-total-column {
    z-index: 4;
    background: #34495e;
  }
  .participation-matrix-table tbody .participation-player-column {
    background: #fff;
    color: #333;
  }
  .participation-matrix-table tbody tr:nth-child(even) .participation-player-column {
    background: #fafafa;
  }
  .participation-matrix-table tbody tr:nth-child(even) .participation-total-column {
    background: #fafafa;
  }
  .participation-matrix-table td {
    min-width: 88px;
    font-size: 1.05rem;
  }
  .participation-matrix-table td.participation-sanctioned {
    background: #d4edda;
    color: #155724;
    font-weight: 700;
  }
  .participation-matrix-table td.participation-unsanctioned {
    background: #fff3cd;
    color: #856404;
    font-weight: 700;
  }
  .participation-matrix-table td.participation-mixed {
    background: #e2d9f3;
    color: #4b2e83;
    font-weight: 700;
  }
  .participation-matrix-table tbody td.participation-cancel-after,
  .participation-matrix-table tbody tr:nth-child(even) td.participation-cancel-after,
  .participation-matrix-table tbody tr:hover td.participation-cancel-after {
    background: #f8d7da !important;
    color: #721c24;
    font-weight: 700;
  }
  .participation-matrix-table tbody tr.participation-row-selected > th,
  .participation-matrix-table tbody tr.participation-row-selected > td {
    box-shadow: inset 0 2px #2980b9, inset 0 -2px #2980b9;
    filter: saturate(1.18);
  }
  .participation-matrix-table tbody tr.participation-row-selected > :first-child {
    box-shadow: inset 3px 0 #2980b9, inset 0 2px #2980b9, inset 0 -2px #2980b9;
  }
  .participation-matrix-selection {
    margin: 4px 0 8px;
    padding: 6px 9px;
    border-left: 3px solid #2980b9;
    background: #eef6fb;
    color: #234;
    font-size: 0.8rem;
  }
  .participation-matrix-memo-panel {
    margin: 8px 0 10px;
    padding: 10px;
    border: 1px solid #ccd8e2;
    border-radius: 5px;
    background: #f8fafc;
  }
  .participation-matrix-memo-header,
  .participation-matrix-memo-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .participation-matrix-memo-header {
    margin-bottom: 7px;
    color: #34495e;
    font-size: 0.84rem;
  }
  #participation-matrix-memo-count {
    color: #718096;
    font-size: 0.76rem;
    white-space: nowrap;
  }
  #participation-matrix-memo {
    box-sizing: border-box;
    width: 100%;
    min-height: 76px;
    resize: vertical;
    padding: 8px 10px;
    border: 1px solid #bdc9d3;
    border-radius: 4px;
    background: #fff;
    color: #263442;
    font: inherit;
    font-size: 0.86rem;
    line-height: 1.5;
  }
  .participation-matrix-memo-actions {
    margin-top: 7px;
    justify-content: flex-end;
  }
  .participation-matrix-memo-actions button {
    padding: 7px 14px;
    border: 0;
    border-radius: 4px;
    background: #2980b9;
    color: #fff;
    cursor: pointer;
  }
