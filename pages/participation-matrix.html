<!-- ========== 選手別出場一覧 ========== -->
<div id="page-participation-matrix" class="page">
  <div class="list-page">
    <div class="page-title-row">
      <div class="page-title">選手別 出場大会一覧</div>
      <button id="participation-matrix-reload" type="button"
              class="page-guide-back-btn"
              onclick="loadParticipationMatrix(true)">再読込</button>
    </div>

    <div class="panel participation-matrix-panel">
      <div class="panel-header">
        選手 × 大会
        <span id="participation-matrix-count" class="count-badge" style="display:none;"></span>
      </div>
      <div class="panel-body">
        <div class="participation-matrix-controls">
          <input id="participation-matrix-player-filter" type="text"
                 placeholder="選手名・ふりがなで絞り込み"
                 oninput="filterParticipationMatrix()">
          <input id="participation-matrix-tournament-filter" type="text"
                 placeholder="大会名で絞り込み"
                 oninput="filterParticipationMatrix()">
        </div>
        <p class="participation-matrix-note">
          ○ 公認大会／△ 非公認大会／○△ 公認・非公認の両方。キャンセル済みは空欄です。
          合計は公認大会の出場回数です。
          選手行を選ぶと、同姓同名の行もまとめてハイライトします。
        </p>
        <div id="participation-matrix-selection" class="participation-matrix-selection"
             style="display:none;"></div>
        <div id="participation-matrix-memo-panel" class="participation-matrix-memo-panel"
             style="display:none;">
          <div class="participation-matrix-memo-header">
            <strong id="participation-matrix-memo-player"></strong>
            <span id="participation-matrix-memo-count">0 / 1000</span>
          </div>
          <textarea id="participation-matrix-memo" maxlength="1000"
                    placeholder="この選手に関する管理用メモ"
                    oninput="participationMatrixMemoChanged()"></textarea>
          <div class="participation-matrix-memo-actions">
            <span id="participation-matrix-memo-status" class="op-status"></span>
            <button id="participation-matrix-memo-save" type="button"
                    onclick="saveParticipationMatrixMemo()">メモを保存</button>
          </div>
        </div>
        <div id="participation-matrix-status" class="status">
          ページを開くと一覧を読み込みます。
        </div>
        <div id="participation-matrix-wrap" class="participation-matrix-wrap" style="display:none;">
          <table id="participation-matrix-table" class="participation-matrix-table">
            <thead id="participation-matrix-thead"></thead>
            <tbody id="participation-matrix-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
