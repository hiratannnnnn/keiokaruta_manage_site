<!-- ========== 出納管理・残高記録 ========== -->
<div id="page-suitou" class="page">
  <div class="list-page">
    <div class="page-title-row">
      <div class="page-title">出納管理</div>
      <div class="page-title-actions">
        <button type="button" class="page-guide-back-btn" onclick="reloadSuitou()">再読込</button>
        <button type="button" class="page-guide-btn" onclick="showAccountingGuide()">
          参加費・デポジットの仕組み
        </button>
      </div>
    </div>

    <div class="su-toolbar">
      <span id="su-fiscal-year" class="count-badge"></span>
      <span class="su-update-status">DBの支払い・デポジット履歴を表示しています。</span>
      <button id="su-tx-download" class="su-update-btn"
              onclick="suDownloadTransactionsCsv()" disabled>履歴をCSVダウンロード</button>
      <button class="su-add-btn" onclick="suShowAddModal()">＋ 追加</button>
    </div>

    <div class="su-columns">
      <!-- 左：出納管理 -->
      <div class="su-section su-col-tx">
        <div class="su-section-title">支払い・デポジット履歴</div>
        <div id="su-tx-status" class="status" style="display:none;"></div>
        <div id="su-tx-table-wrap" class="mm-table-wrapper" style="display:none;">
          <table class="mm-table">
            <thead>
              <tr>
                <th>氏名</th>
                <th>金額</th>
                <th>事由</th>
                <th>最終更新</th>
                <th>状態</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="su-tx-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 右：DBの請求・支払い状態 -->
      <div class="su-section su-col-balance">
        <div class="su-section-title">請求・支払い状況</div>
        <div id="su-entry-status" class="status" style="display:none;"></div>
        <div id="su-entry-table-wrap" class="mm-table-wrapper" style="display:none;">
          <table class="mm-table">
            <thead>
              <tr>
                <th>氏名</th>
                <th>大会</th>
                <th>請求額</th>
                <th>支払済額</th>
                <th>残額</th>
                <th>状態</th>
                <th>デポジット</th>
              </tr>
            </thead>
            <tbody id="su-entry-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ===== 確認モーダル ===== -->
<div id="su-confirm-modal" class="mm-modal-overlay" style="display:none;" onclick="suCloseConfirm(event)">
  <div class="mm-modal-box" style="width:360px;">
    <div class="mm-modal-header">
      <span class="mm-modal-title" id="su-confirm-title">確認</span>
      <button class="mm-modal-close" onclick="suCloseConfirm()">✕</button>
    </div>
    <div class="mm-modal-body">
      <p id="su-confirm-message" style="font-size:0.9rem;line-height:1.6;white-space:pre-wrap;"></p>
    </div>
    <div class="mm-modal-footer">
      <button class="mm-btn-secondary" onclick="suCloseConfirm()">キャンセル</button>
      <button class="mm-btn-primary" id="su-confirm-ok">OK</button>
    </div>
  </div>
</div>

<!-- ===== 追加モーダル ===== -->
<div id="su-add-modal" class="mm-modal-overlay" style="display:none;" onclick="suCloseAddModal(event)">
  <div class="mm-modal-box" style="width:460px;">
    <div class="mm-modal-header">
      <span class="mm-modal-title">支払い・デポジットを追加</span>
      <button class="mm-modal-close" onclick="suCloseAddModal()">✕</button>
    </div>
    <div class="mm-modal-body" style="gap:14px;">
      <div class="fc-field-row">
        <label class="su-add-label">対象の申込 <span class="fc-required-mark">*</span></label>
        <select id="su-add-entry" class="fc-text-input su-add-select"></select>
      </div>
      <div class="fc-field-row">
        <label class="su-add-label">処理 <span class="fc-required-mark">*</span></label>
        <select id="su-add-operation" class="fc-text-input su-add-select"
                onchange="suOperationChanged()">
          <option value="payment">参加費の支払い</option>
          <option value="deposit_received">デポジット受入</option>
          <option value="deposit_refunded">デポジット返金</option>
          <option value="deposit_application">デポジットを参加費へ充当</option>
        </select>
      </div>
      <div id="su-add-method-wrap" class="fc-field-row">
        <label class="su-add-label">支払い方法</label>
        <select id="su-add-method" class="fc-text-input su-add-select">
          <option value="bank_transfer">銀行振込</option>
          <option value="cash">現金</option>
          <option value="adjustment">調整</option>
        </select>
      </div>
      <div class="fc-field-row">
        <label class="su-add-label">金額 <span class="fc-required-mark">*</span></label>
        <input type="number" id="su-add-amount" class="fc-text-input" min="0" step="100" value="2500">
      </div>
      <div class="fc-field-row">
        <label class="su-add-label">メモ</label>
        <textarea id="su-add-note" class="fc-text-input" maxlength="1000"></textarea>
      </div>
      <input id="su-add-idempotency" type="hidden">
    </div>
    <div id="su-add-error" style="display:none;color:#e74c3c;font-size:0.85rem;padding:0 4px;"></div>
    <div class="mm-modal-footer">
      <button class="mm-btn-secondary" onclick="suCloseAddModal()">キャンセル</button>
      <button id="su-add-submit" class="mm-btn-primary" onclick="suSubmitAdd()">追加</button>
    </div>
  </div>
</div>
